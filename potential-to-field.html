:root{
  --bg:#ffffff; --panel:#f5f6f8; --fg:#23262b; --muted:#6b7078; --line:#dcdee3;
  --p1:#a3563c; --p2:#3a6ea5; --p3:#4f7a45; --btn:#eceff3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181c; --panel:#212329; --fg:#e6e6e6; --muted:#9aa0a8; --line:#3a3d45;
    --p1:#cf9179; --p2:#7fa8d4; --p3:#8fae7f; --btn:#2c2f37;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);border:none;
  font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.v{font-family:KaTeX_Math,Georgia,serif;font-style:italic}
.n{font-family:KaTeX_Main,Georgia,serif}
.wrap{width:100%;max-width:940px;margin:0 auto;padding:6px 6px 10px}
.row{display:flex;gap:10px;align-items:flex-start}
.colL{flex:0 0 46%;min-width:0}
.colR{flex:1 1 0;min-width:0}
canvas{display:block;width:100%}
@media (max-width:720px){.row{flex-direction:column}.colL,.colR{flex:auto;width:100%}}
.head{padding:2px 4px 6px;font-size:15px}
.panel{background:var(--panel);border-radius:10px;padding:9px 12px 11px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px}
.ctl{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.ctl output{font-family:KaTeX_Main,Georgia,serif;min-width:52px;text-align:right}
input[type=range]{flex:1 1 60px;accent-color:var(--p2);min-width:44px;max-width:230px}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:5px 13px;font-size:13px;cursor:pointer}
button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
.readout{margin-top:9px}
.rl{display:block;width:100%;font-size:13px;line-height:1.9}
.rk{display:inline-block;min-width:46px;color:var(--muted)}
.rl .n{margin:0 1px}
.rule{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:13px;line-height:1.75}
.hint{margin-top:6px;font-size:12.5px;color:var(--muted);min-height:1.6em}
.c1{color:var(--p1);font-weight:700}
.c2{color:var(--p2);font-weight:700}
.c3{color:var(--p3);font-weight:700}
.warn{color:var(--p1)}
</style>
</head>
<body>
<div class='wrap'>
  <div class='head'><span class='n fn'>由三个点的电势求匀强电场：分场 → 垂线交点 → 圆内接四边形</span></div>
  <div class='row'>
    <div class='colL'>
      <canvas id='cvA'></canvas>
      <div class='panel'>
    <div class='grid'>
      <div class='ctl'>
        <span class='lb'><span class='v c1'>E</span> 大小</span>
        <input id='sE' type='range' min='1.5' max='4' step='0.25' value='3'>
        <output id='oE'>3.0</output>
      </div>
      <div class='ctl'>
        <span class='lb'><span class='v c2'>θ</span> 方向</span>
        <input id='sT' type='range' min='0' max='359' step='1' value='30'>
        <output id='oT'>30°</output>
      </div>
    </div>
    <div class='btns'>
      <button id='bNext'>下一步 ▶</button>
      <button id='bPrev'>上一步 ◀</button>
      <button id='bClear'>重新取点</button>
      <label class='chk'><input id='kAns' type='checkbox'>显示真实场（答案）</label>
    </div>
    <div class='readout' id='rd'></div>
    <div class='rule' id='rule'></div>
    <div class='hint' id='hint'></div>
      </div>
    </div>
    <div class='colR'>
      <canvas id='cvB'></canvas>
    </div>
  </div>
</div>

/* ================= 小工具 ================= */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rad(d){return d*PI/180;}
function deg(r){return r*180/PI;}
function unit(ax,ay){
  var L=Math.sqrt(ax*ax+ay*ay);
  if(L<1e-6) return [0,0];
  return [ax/L,ay/L];
}
function nm(v,d){
  if(v===null||v===undefined||!isFinite(v)) return '\u2014';
  var s=(Math.abs(v)<Math.pow(10,-d)/2?0:v).toFixed(d);
  return s.replace('-','\u2212');
}
function fontOf(isVar,size){return (isVar?'italic ':'')+size+'px '+(isVar?'KaTeX_Math':'KaTeX_Main')+',Georgia,serif';}
function partsOf(ps){
  var out=[],i,p;
  for(i=0;i<ps.length;i++){
    p=ps[i];
    if(typeof p==='string') out.push({t:p,v:false,sub:false,sup:false});
    else out.push({t:p.t,v:!!p.v,sub:!!p.sub,sup:!!p.sup});
  }
  return out;
}
function pSize(p,size){return p.sub?size*0.72:(p.sup?size*0.76:size);}
function pDy(p,size){return p.sub?size*0.20:(p.sup?-size*0.32:0);}
function pFont(p,size){return fontOf(p.v,pSize(p,size));}
function pBox(ps,x,y,size,align,base){
  var p=partsOf(ps),i,w=0,eu=0,ed=0;
  for(i=0;i<p.length;i++){
    ctx.font=pFont(p[i],size); w+=ctx.measureText(p[i].t).width;
    if(p[i].sup) eu=Math.max(eu,size*0.34);
    if(p[i].sub) ed=Math.max(ed,size*0.24);
  }
  var sx=(align==='center')?x-w/2:((align==='right')?x-w:x);
  var asc=size*0.80, desc=size*0.22, top;
  if(base==='top') top=y;
  else if(base==='bottom') top=y-(asc+desc);
  else if(base==='middle') top=y-(asc+desc)/2;
  else top=y-asc;
  return {x:sx,y:top-eu,w:w,h:asc+desc+eu+ed};
}
function rtext(ps,x,y,size,color,align,base,halo){
  var p=partsOf(ps),i,w=0,sx;
  for(i=0;i<p.length;i++){ctx.font=pFont(p[i],size); w+=ctx.measureText(p[i].t).width;}
  sx=(align==='center')?x-w/2:((align==='right')?x-w:x);
  ctx.textAlign='left'; ctx.fillStyle=color;
  for(i=0;i<p.length;i++){
    ctx.font=pFont(p[i],size);
    ctx.textBaseline=base||'alphabetic';
    if(halo&&HALO){ctx.strokeStyle=HALO; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeText(p[i].t,sx,y+pDy(p[i],size));}
    ctx.fillText(p[i].t,sx,y+pDy(p[i],size));
    sx+=ctx.measureText(p[i].t).width;
  }
  return w;
}
function rtextBox(ps,x,y,size,color,align,base){
  var b=pBox(ps,x,y,size,align,base);
  ctx.fillStyle=HALO; ctx.fillRect(b.x-2.5,b.y-1.5,b.w+5,b.h+3);
  rtext(ps,x,y,size,color,align,base,false);
  return b.w;
}

/* ---- 占位避让 ---- */
var OCC=[], OCCW=470, OCCH=548;
function occReset(){OCC=[];}
function occAdd(x,y,w,h){OCC.push([x,y,w,h]);}
function occArea(x,y,w,h){
  var a=0,i,o,ox,oy;
  for(i=0;i<OCC.length;i++){
    o=OCC[i];
    ox=Math.min(x+w,o[0]+o[2])-Math.max(x,o[0]);
    oy=Math.min(y+h,o[1]+o[3])-Math.max(y,o[1]);
    if(ox>0&&oy>0) a+=ox*oy;
  }
  return a;
}
function put(ps,x,y,size,color,align,base){
  var b=pBox(ps,x,y,size,align,base);
  rtextBox(ps,x,y,size,color,align,base);
  occAdd(b.x-2.5,b.y-1.5,b.w+5,b.h+3);
  return b;
}
/* cands: [[x,y],...]；全撞时取重叠最小处硬画 */
function tryPut(ps,size,color,cands,align,base,maxOv){
  var i,x,y,b,a,best=null,bestA=1e9;
  for(i=0;i<cands.length;i++){
    x=cands[i][0]; y=cands[i][1];
    b=pBox(ps,x,y,size,align||'center',base||'middle');
    if(b.x<3||b.y<3||b.x+b.w>OCCW-3||b.y+b.h>OCCH-3) continue;
    a=occArea(b.x,b.y,b.w,b.h);
    if(a<0.5){ rtextBox(ps,x,y,size,color,align||'center',base||'middle'); occAdd(b.x-2.5,b.y-1.5,b.w+5,b.h+3); return true; }
    if(a<bestA){bestA=a; best=[x,y,align||'center',b];}
  }
  if(best&&bestA<=(maxOv===undefined?70:maxOv)){
    rtextBox(ps,best[0],best[1],size,color,best[2],base||'middle');
    occAdd(best[3].x-2.5,best[3].y-1.5,best[3].w+5,best[3].h+3);
    return true;
  }
  return false;
}

/* ---- 实线登记：矢量值标签可压虚线，不可压实线 ---- */
var SOLID=[];
function solidReset(){SOLID=[];}
function solidSeg(x1,y1,x2,y2){
  var L=Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1)), n=Math.max(2,Math.ceil(L/4)), i;
  for(i=0;i<=n;i++) SOLID.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]);
}
function solidHit(b){
  var i,p;
  for(i=0;i<SOLID.length;i++){
    p=SOLID[i];
    if(p[0]>b.x-1.5&&p[0]<b.x+b.w+1.5&&p[1]>b.y-1.5&&p[1]<b.y+b.h+1.5) return true;
  }
  return false;
}
/* 数值标签紧贴矢量尖端：沿方向排在箭头之外，横向逐级让位 */
function tipPut(ps,size,color,vx,vy,tx,ty){
  var u=unit(vx,vy), nx=-u[1], ny=u[0], cands=[], d, k, offs=[0,-13,13,-26,26], i, x, y, b;
  if(u[0]===0&&u[1]===0){
    cands=[[tx+18,ty-16],[tx-18,ty-16],[tx+18,ty+18],[tx-18,ty+18]];
  } else {
    for(d=10;d<=38;d+=7) for(k=0;k<offs.length;k++)
      cands.push([tx+u[0]*d+nx*offs[k], ty+u[1]*d+ny*offs[k]]);
  }
  for(i=0;i<cands.length;i++){
    x=cands[i][0]; y=cands[i][1];
    b=pBox(ps,x,y,size,'center','middle');
    if(b.x<3||b.y<3||b.x+b.w>OCCW-3||b.y+b.h>OCCH-3) continue;
    if(occArea(b.x,b.y,b.w,b.h)<0.5&&!solidHit(b)){
      rtextBox(ps,x,y,size,color,'center','middle');
      occAdd(b.x-2.5,b.y-1.5,b.w+5,b.h+3);
      return true;
    }
  }
  /* 兜底：退回沿杆老位置 */
  return tryPutAway(ps,size,color,vecLabel(vx,vy),APX,APY);
}
/* 宽标签专用：候选点落在锚点左侧就右对齐、右侧就左对齐，让整条标签「背向锚点」展开。
   居中放置时，宽标签的远端会甩回锚点附近，把 A′、α 之类的短标签压住（2026-10-25 实测）。 */
function tryPutAway(ps,size,color,cands,ax,ay,maxOv){
  var i,cx,cy,al,px,b,a,best=null,bestA=1e9;
  for(i=0;i<cands.length;i++){
    cx=cands[i][0]; cy=cands[i][1];
    al=(cx>=ax)?'left':'right';
    px=(al==='left')?cx+6:cx-6;
    b=pBox(ps,px,cy,size,al,'middle');
    if(b.x<3||b.y<3||b.x+b.w>OCCW-3||b.y+b.h>OCCH-3) continue;
    a=occArea(b.x,b.y,b.w,b.h);
    if(a<0.5){ rtextBox(ps,px,cy,size,color,al,'middle'); occAdd(b.x-2.5,b.y-1.5,b.w+5,b.h+3); return true; }
    if(a<bestA){bestA=a; best=[px,cy,al,b];}
  }
  if(best&&bestA<=(maxOv===undefined?70:maxOv)){
    rtextBox(ps,best[0],best[1],size,color,best[2],'middle');
    occAdd(best[3].x-2.5,best[3].y-1.5,best[3].w+5,best[3].h+3);
    return true;
  }
  return false;
}

/* ---- 图元 ---- */
function theme(){
  var dk=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(dk) return {grid:'rgba(255,255,255,0.07)',tick:'#9aa0a8',bg:'#17181c',halo:'#17181c',
    dim:'rgba(200,204,210,0.34)',fg:'#e6e6e6',muted:'#9aa0a8',
    p1:'#cf9179',p2:'#7fa8d4',p3:'#8fae7f',bd:'#3a3d45'};
  return {grid:'rgba(20,24,32,0.07)',tick:'#6b7078',bg:'#ffffff',halo:'#ffffff',
    dim:'rgba(47,53,66,0.30)',fg:'#23262b',muted:'#6b7078',
    p1:'#a3563c',p2:'#3a6ea5',p3:'#4f7a45',bd:'#dcdee3'};
}
function dash(a){ctx.setLineDash(a||[]);}
function line(x1,y1,x2,y2,color,w){
  ctx.strokeStyle=color; ctx.lineWidth=w||1; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function dot(x,y,r,color){ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,2*PI); ctx.fill();}
function ring(x,y,r,fill,stroke,lw){
  ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.lineWidth=lw||2;
  ctx.beginPath(); ctx.arc(x,y,r,0,2*PI); ctx.fill(); ctx.stroke();
}
function arrow(x1,y1,x2,y2,color,w,head){
  var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), ux,uy,bx,by,h=head||9;
  if(L<0.8) return;
  ux=dx/L; uy=dy/L; bx=x2-ux*h; by=y2-uy*h;
  ctx.strokeStyle=color; ctx.lineWidth=w||2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(bx-uy*h*0.44,by+ux*h*0.44);
  ctx.lineTo(bx+uy*h*0.44,by-ux*h*0.44);
  ctx.closePath(); ctx.fill();
}
/* 直线与矩形求交（Liang–Barsky）：返回 [x1,y1,x2,y2] 或 null */
function clipRay(qx,qy,dx,dy,x0,y0,x1,y1){
  var tmin=-1e9, tmax=1e9, i, p, q, r;
  for(i=0;i<4;i++){
    if(i===0){p=-dx; q=qx-x0;}
    else if(i===1){p=dx; q=x1-qx;}
    else if(i===2){p=-dy; q=qy-y0;}
    else {p=dy; q=y1-qy;}
    if(Math.abs(p)<1e-9){ if(q<0) return null; }
    else{
      r=q/p;
      if(p<0){ if(r>tmax) return null; if(r>tmin) tmin=r; }
      else { if(r<tmin) return null; if(r<tmax) tmax=r; }
    }
  }
  if(tmin>tmax) return null;
  return [qx+dx*tmin,qy+dy*tmin,qx+dx*tmax,qy+dy*tmax];
}
/* 短弧 a1→a2 */
function arc2(cx,cy,a1,a2,r,color,w){
  var d=a2-a1;
  while(d>PI) d-=2*PI;
  while(d<-PI) d+=2*PI;
  ctx.strokeStyle=color; ctx.lineWidth=w||1.4;
  ctx.beginPath(); ctx.arc(cx,cy,r,a1,a1+d,d<0); ctx.stroke();
}
/* 直角标记：顶点 v，两条单位边 e1/e2 */
function rmark(vx,vy,e1x,e1y,e2x,e2y,color){
  var s=9, p1x=vx+e1x*s, p1y=vy+e1y*s, p2x=vx+e2x*s, p2y=vy+e2y*s;
  var cx=p1x+e2x*s, cy=p1y+e2y*s;
  line(p1x,p1y,cx,cy,color,1.2);
  line(p2x,p2y,cx,cy,color,1.2);
}

/* ================= 物理内核 ================= */
function updField(){ EX=EM*Math.cos(rad(TH)); EY=EM*Math.sin(rad(TH)); }
function phiAt(x,y){ return PHI0-(EX*(x-RCX)+EY*(y-RCY)); }
function dist(p,q){ return Math.sqrt((p.x-q.x)*(p.x-q.x)+(p.y-q.y)*(p.y-q.y)); }

function solve(){
  SOL=null;
  if(pts.length<3) return;
  var A=pts[0], B=pts[1], C=pts[2];
  var v1x=B.x-A.x, v1y=B.y-A.y, d1=Math.sqrt(v1x*v1x+v1y*v1y);
  var v2x=C.x-A.x, v2y=C.y-A.y, d2=Math.sqrt(v2x*v2x+v2y*v2y);
  var d3=dist(B,C);
  if(d1<1e-4||d2<1e-4) return;
  var u1x=v1x/d1, u1y=v1y/d1, u2x=v2x/d2, u2y=v2y/d2;
  var pA=phiAt(A.x,A.y), pB=phiAt(B.x,B.y), pC=phiAt(C.x,C.y);
  var E1=(pA-pB)/d1, E2=(pA-pC)/d2;
  /* 物理 (x,y) → 屏幕 (x,−y) */
  var c1x=u1x, c1y=-u1y, c2x=u2x, c2y=-u2y;
  var Fx=APX+KV*E1*c1x, Fy=APY+KV*E1*c1y;
  var Gx=APX+KV*E2*c2x, Gy=APY+KV*E2*c2y;
  var n1x=-c1y, n1y=c1x, n2x=-c2y, n2y=c2x;
  var det=n2x*n1y-n1x*n2y;
  var rx=Gx-Fx, ry=Gy-Fy, tt=0, Px=APX, Py=APY, warn='';
  if(Math.abs(det)<1e-6) warn='两条垂线近乎平行，交点不可靠，请把三个点重取得更开一些。';
  else { tt=(-rx*n2y+n2x*ry)/det; Px=Fx+tt*n1x; Py=Fy+tt*n1y; }
  var Emag=Math.sqrt((Px-APX)*(Px-APX)+(Py-APY)*(Py-APY))/KV;
  var Eth=deg(Math.atan2(-(Py-APY),Px-APX)); if(Eth<0) Eth+=360;
  var FG=Math.sqrt((Gx-Fx)*(Gx-Fx)+(Gy-Fy)*(Gy-Fy))/KV;
  /* α：两条分场矢量的夹角；某个分量为 0 时退回 ∠BAC */
  var aF=Math.atan2(Fy-APY,Fx-APX), aG=Math.atan2(Gy-APY,Gx-APX), da=aG-aF, alpha;
  while(da>PI) da-=2*PI;
  while(da<-PI) da+=2*PI;
  alpha=Math.abs(da);
  var aGeo=Math.abs(Math.acos(clamp(u1x*u2x+u1y*u2y,-1,1)));
  if(Math.abs(E1)<1e-4||Math.abs(E2)<1e-4) alpha=aGeo;
  var Ecalc=(Math.sin(alpha)>1e-6)?FG/Math.sin(alpha):0;
  if(!warn){
    if(d1<0.6||d2<0.6) warn='A 与 B（或 C）离得太近，比值会放大误差，请把点拉开。';
    else if(Math.sin(alpha)<0.26) warn='两条方向线夹角接近 0° 或 180°，垂线交点不可靠，请重取点。';
  }
  SOL={A:A,B:B,C:C,d1:d1,d2:d2,d3:d3,pA:pA,pB:pB,pC:pC,
    E1:E1,E2:E2,u1x:u1x,u1y:u1y,u2x:u2x,u2y:u2y,
    c1x:c1x,c1y:c1y,c2x:c2x,c2y:c2y,
    Fx:Fx,Fy:Fy,Gx:Gx,Gy:Gy,Px:Px,Py:Py,
    n1x:n1x,n1y:n1y,n2x:n2x,n2y:n2y,
    Emag:Emag,Eth:Eth,FG:FG,alpha:alpha,aGeo:aGeo,Ecalc:Ecalc,warn:warn};
}

/* ================= 画布 A：场区图 ================= */
function niceStep(x){
  var c=[1,2,5,10,20,25,50,100],i;
  for(i=0;i<c.length;i++){ if(c[i]>=x) return c[i]; }
  return 200;
}
/* 等势线：只画线，标签留到 drawEqLabels（避开后来落位的刻度字） */
function drawEq(T){
  var lv, step, c, r0x, r0y, dx, dy, seg, i, j, ux, uy, ex, ey;
  var cs=[phiAt(0,0),phiAt(WX,0),phiAt(0,WY),phiAt(WX,WY)];
  var pmin=Math.min.apply(null,cs), pmax=Math.max.apply(null,cs);
  EQSEG=[];
  step=niceStep((pmax-pmin)/5);
  dx=-EY/EM; dy=-EX/EM;
  for(lv=Math.ceil(pmin/step)*step; lv<=pmax+1e-9; lv+=step){
    c=(PHI0-lv)/(EX*EX+EY*EY);
    r0x=XA(RCX+c*EX); r0y=YA(RCY+c*EY);
    seg=clipRay(r0x,r0y,dx,dy,XA(0),YA(WY),XA(WX),YA(0));
    if(!seg) continue;
    EQSEG.push([lv,seg]);
    dash([7,5]);
    line(seg[0],seg[1],seg[2],seg[3],T.dim,1.5);
    dash();
  }
  /* 匀强场箭头：4 列 × 2 行 */
  ux=EX/EM; uy=EY/EM;
  var cols=[2,6,10,13], rows=[1.6,5.4];
  ctx.save(); ctx.globalAlpha=0.45;
  for(i=0;i<cols.length;i++) for(j=0;j<rows.length;j++){
    ex=XA(cols[i]); ey=YA(rows[j]);
    arrow(ex-ux*13,ey+uy*13,ex+ux*13,ey-uy*13,T.p2,1.8,7);
  }
  ctx.restore();
}
function drawEqLabels(T){
  var i, seg, ex, ey;
  /* 「真实场」注记先占位（硬画），等势线数值标签再避开它 */
  put(['真实场 ',{t:'E',v:true},' = ',nm(EM,1),' V/m'],OXA+8,OYA-15,13.5,T.p2,'left','middle');
  for(i=0;i<EQSEG.length;i++){
    seg=EQSEG[i][1];
    ex=seg[0]; ey=seg[1];
    if(seg[3]<seg[1]){ ex=seg[2]; ey=seg[3]; }
    tryPut([nm(EQSEG[i][0],0),' V'],12.5,T.muted,
      [[ex,ey],[ex,ey-15],[ex,ey+15],[ex-28,ey],[ex+28,ey],
       [ex-28,ey-15],[ex+28,ey-15],[ex-28,ey+15],[ex+28,ey+15],
       [ex-44,ey],[ex+44,ey],[ex,ey-30],[ex,ey+30]],'center','middle');
  }
}

function drawA(T){
  var i,j,x,y,segs;
  ctx=cA;
  ctx.setTransform(cvA.width/LWA,0,0,cvA.height/LHA,0,0);
  ctx.clearRect(0,0,LWA,LHA);
  occReset(); OCCW=LWA; OCCH=LHA;

  rtext(['场区俯视图 · 点击取点'],8,12,13.5,T.muted,'left','top');
  occAdd(6,10,152,18);
  rtext(['每格 1 m'],LWA-8,12,12.5,T.muted,'right','top');
  occAdd(LWA-86,10,80,17);

  /* 网格与边框 */
  for(i=0;i<=WX;i++) line(XA(i),YA(0),XA(i),YA(WY),T.grid,1);
  for(j=0;j<=WY;j++) line(XA(0),YA(j),XA(WX),YA(j),T.grid,1);
  line(XA(0),YA(WY),XA(WX),YA(WY),T.bd,1.4);
  line(XA(0),YA(0),XA(WX),YA(0),T.bd,1.4);
  line(XA(0),YA(0),XA(0),YA(WY),T.bd,1.4);
  line(XA(WX),YA(0),XA(WX),YA(WY),T.bd,1.4);

  /* 答案层：等势线与场箭头（在刻度字之前画，避免压字） */
  if(showAns) drawEq(T);

  /* 三角形：AB 用赭（对应 E₁），AC 用苔绿（对应 E₂），BC 淡显 */
  if(pts.length>=2) line(XA(pts[0].x),YA(pts[0].y),XA(pts[1].x),YA(pts[1].y),T.p1,1.7);
  if(pts.length>=3){
    line(XA(pts[0].x),YA(pts[0].y),XA(pts[2].x),YA(pts[2].y),T.p3,1.7);
    dash([5,4]);
    line(XA(pts[1].x),YA(pts[1].y),XA(pts[2].x),YA(pts[2].y),T.muted,1.2);
    dash();
  }

  /* 标尺：刻度字先落位并登记占位 */
  for(i=0;i<=WX;i+=2) put([String(i)],XA(i),OYA+13,12.5,T.tick,'center','top');
  for(j=2;j<=WY;j+=2) put([String(j)],OXA-9,YA(j),12.5,T.tick,'right','middle');
  put([{t:'x',v:true},'/m'],XA(WX)+8,OYA+13,12.5,T.tick,'left','top');
  put([{t:'y',v:true},'/m'],OXA-9,YA(WY-1)-16,12.5,T.tick,'right','middle');

  if(showAns) drawEqLabels(T);

  /* 边长标签 */
  segs=[];
  if(pts.length>=2) segs.push({p:0,q:1,r:2,lab:[{t:'A',v:true},{t:'B',v:true}],len:dist(pts[0],pts[1])});
  if(pts.length>=3){
    segs.push({p:0,q:2,r:1,lab:[{t:'A',v:true},{t:'C',v:true}],len:SOL?SOL.d2:dist(pts[0],pts[2])});
    segs.push({p:1,q:2,r:0,lab:[{t:'B',v:true},{t:'C',v:true}],len:SOL?SOL.d3:dist(pts[1],pts[2])});
  }
  if(SOL) segs[0].len=SOL.d1;
  for(i=0;i<segs.length;i++) segLabel(T,segs[i]);

  /* 点与注记 */
  var pcol=[T.p2,T.p1,T.p3];
  var pname=[{t:'A',v:true},{t:'B',v:true},{t:'C',v:true}];
  for(i=0;i<pts.length;i++) ring(XA(pts[i].x),YA(pts[i].y),5,pcol[i],pcol[i],1.4);
  for(i=0;i<pts.length;i++){
    x=XA(pts[i].x); y=YA(pts[i].y);
    tryPut(pname[i],13.5,pcol[i],[[x-16,y-15],[x+17,y-15],[x-16,y+17],[x+17,y+17]],'center','middle');
  }
  var pv=[SOL?SOL.pA:null,SOL?SOL.pB:null,SOL?SOL.pC:null];
  for(i=0;i<pts.length;i++){
    if(pv[i]===null) pv[i]=phiAt(pts[i].x,pts[i].y);
    x=XA(pts[i].x); y=YA(pts[i].y);
    tryPut([{t:'\u03C6',v:true},{t:pname[i].t,v:true,sub:true},' = ',nm(pv[i],2),' V'],
      12.5,T.fg,
      [[x,y-26],[x,y+28],[x+36,y-22],[x-36,y-22],[x+36,y+24],[x-36,y+24],
       [x,y-48],[x,y+50],[x+58,y],[x-58,y]],'center','middle');
  }
}
function segLabel(T,sg){
  var P=pts[sg.p], Q=pts[sg.q];
  var px=XA(P.x), py=YA(P.y), qx=XA(Q.x), qy=YA(Q.y);
  var dx=qx-px, dy=qy-py, L=Math.sqrt(dx*dx+dy*dy);
  if(L<1) return;
  var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  if(sg.r<pts.length){
    var rx=XA(pts[sg.r].x)-px, ry=YA(pts[sg.r].y)-py;
    if(nx*rx+ny*ry>0){ nx=-nx; ny=-ny; }
  } else if(ny>0){ nx=-nx; ny=-ny; }
  var mx=(px+qx)/2, my=(py+qy)/2, cand=[], i, j;
  var off=[16,30,44], alo=[0,26,-26];
  for(i=0;i<off.length;i++) for(j=0;j<alo.length;j++)
    cand.push([mx+nx*off[i]+ux*alo[j], my+ny*off[i]+uy*alo[j]]);
  tryPut(sg.lab.concat([' = ',nm(sg.len,2),' m']),12.5,T.muted,cand,'center','middle');
}

/* ================= 画布 B：矢量合成图 ================= */
function vecLabel(vx,vy){
  var L=Math.sqrt(vx*vx+vy*vy);
  if(L<1) return [[APX+24,APY-18],[APX-24,APY-18],[APX+24,APY+20],[APX-24,APY+20]];
  var ux=vx/L, uy=vy/L, nx=-uy, ny=ux, out=[], i, j;
  /* 沿矢量取 0.42/0.62/0.25 处：尖端留给端点字母（F / G / P） */
  var f=[0.42,0.62,0.25], o=[16,29,43];
  for(i=0;i<f.length;i++) for(j=0;j<o.length;j++){
    var bx=APX+vx*f[i], by=APY+vy*f[i];
    out.push([bx+nx*o[j],by+ny*o[j]]);
    out.push([bx-nx*o[j],by-ny*o[j]]);
  }
  return out;
}
function drawFormula(T,s){

  rtext(['\u2220',{t:'A',v:true},prim,{t:'F',v:true},{t:'P',v:true},' = \u2220',{t:'A',v:true},prim,{t:'G',v:true},{t:'P',v:true},' = 90\u00B0'],
    x1,y0+lh,12.5,T.muted,'left','alphabetic');

  rtext([{t:'A',v:true},prim,{t:'P',v:true},' = ',{t:'F',v:true},{t:'G',v:true},' / sin ',{t:'\u03B1',v:true}],
    x2,y0,14,T.p2,'left','alphabetic');
  if(s){
    rtext(['  = ',nm(s.FG,2),' / sin ',nm(deg(s.alpha),1),'\u00B0'],x2,y0+lh,13.5,T.fg,'left','alphabetic');
    rtext(['  = ',nm(s.Ecalc,2),' V/m'],x2,y0+2*lh,13.5,T.fg,'left','alphabetic');

  }

  line(x1,sy-4,x1,sy+4,T.fg,1.6);
  line(x1+96,sy-4,x1+96,sy+4,T.fg,1.6);
  rtext(['比例尺 2 V/m'],x1+106,sy,12.5,T.muted,'left','middle');
}
function drawB(T){
  ctx=cB;
  ctx.setTransform(cvB.width/LWB,0,0,cvB.height/LHB,0,0);
  ctx.clearRect(0,0,LWB,LHB);
  occReset(); OCCW=LWB; OCCH=LHB;

  rtext(['矢量合成图'],8,12,13.5,T.muted,'left','top');
  occAdd(6,10,92,18);

  if(!SOL||ST<4){
    var msg = (pts.length>=3&&!SOL) ? 'B 或 C 与 A 重合，请「重新取点」' : '取满三个点后，按「下一步」在此作图';
    rtextBox([msg],LWB/2,215,13.5,T.muted,'center','middle');
    drawFormula(T,null);
    return;
  }
  var s=SOL, prim={t:'\u2032',sup:true};
  var sr1=clipRay(APX,APY,s.c1x,s.c1y,CBX0,CBY0,CBX1,CBY1);
  var sr2=clipRay(APX,APY,s.c2x,s.c2y,CBX0,CBY0,CBX1,CBY1);
  /* 方向参考线 */
  dash([4,4]);
  if(sr1) line(sr1[0],sr1[1],sr1[2],sr1[3],T.dim,1.2);
  if(sr2) line(sr2[0],sr2[1],sr2[2],sr2[3],T.dim,1.2);
  dash();

  /* 第 5 步：过两条分场的末端作垂线 */
  if(ST>=5){
    var pl1=clipRay(s.Fx,s.Fy,s.n1x,s.n1y,CBX0,CBY0,CBX1,CBY1);
    var pl2=clipRay(s.Gx,s.Gy,s.n2x,s.n2y,CBX0,CBY0,CBX1,CBY1);
    dash([6,4]);
    if(pl1) line(pl1[0],pl1[1],pl1[2],pl1[3],T.muted,1.3);
    if(pl2) line(pl2[0],pl2[1],pl2[2],pl2[3],T.muted,1.3);
    dash();
    var fa=unit(APX-s.Fx,APY-s.Fy), fp=unit(s.Px-s.Fx,s.Py-s.Fy);
    var ga=unit(APX-s.Gx,APY-s.Gy), gp=unit(s.Px-s.Gx,s.Py-s.Gy);
    rmark(s.Fx,s.Fy,fa[0],fa[1],fp[0],fp[1],T.muted);
    rmark(s.Gx,s.Gy,ga[0],ga[1],gp[0],gp[1],T.muted);
  }
  /* 第 6 步：外接圆与圆内接四边形 */
  if(ST>=6){
    var mx=(APX+s.Px)/2, my=(APY+s.Py)/2, rr=Math.sqrt((s.Px-APX)*(s.Px-APX)+(s.Py-APY)*(s.Py-APY))/2;
    ctx.fillStyle=(T.bg==='#17181c')?'rgba(127,168,212,0.14)':'rgba(58,110,165,0.10)';
    ctx.beginPath();
    ctx.moveTo(APX,APY); ctx.lineTo(s.Fx,s.Fy); ctx.lineTo(s.Px,s.Py); ctx.lineTo(s.Gx,s.Gy); ctx.closePath();
    ctx.fill();
    dash([6,5]);
    ctx.strokeStyle=T.muted; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(mx,my,rr,0,2*PI); ctx.stroke();
    dash();
    line(s.Fx,s.Fy,s.Gx,s.Gy,T.p2,1.6);
  }

  /* 起点 A′：最先落位，其余标签都避开它 */
  ring(APX,APY,4.5,T.fg,T.fg,1.2);
  tryPut([{t:'A',v:true},prim],14.5,T.fg,
    [[APX-17,APY-15],[APX-17,APY+17],[APX+19,APY-15],[APX+19,APY+17],
     [APX,APY-25],[APX,APY+27],[APX-30,APY-26],[APX+32,APY-26],[APX-30,APY+28],[APX+32,APY+28]],
    'center','middle');

  /* 两条分场矢量 + 总场 */
  arrow(APX,APY,s.Fx,s.Fy,T.p1,2.2,9);
  arrow(APX,APY,s.Gx,s.Gy,T.p3,2.2,9);
  if(ST>=5){
    ring(s.Px,s.Py,4.5,T.p2,T.p2,1.2);
    arrow(APX,APY,s.Px,s.Py,T.p2,2.8,11);
  }
  /* 登记实线（供矢量值标签避让）：分场、总场、弦，以及 α 弧 */
  solidReset();
  solidSeg(APX,APY,s.Fx,s.Fy);
  solidSeg(APX,APY,s.Gx,s.Gy);
  if(ST>=5) solidSeg(APX,APY,s.Px,s.Py);
  if(ST>=6) solidSeg(s.Fx,s.Fy,s.Gx,s.Gy);

  /* α 弧：先落位（它贴着弧画，位置最受限），其余标签再让它 */
  if(Math.abs(s.E1)>0.02&&Math.abs(s.E2)>0.02){
    var aF=Math.atan2(s.Fy-APY,s.Fx-APX), aG=Math.atan2(s.Gy-APY,s.Gx-APX), dd=aG-aF;
    while(dd>PI) dd-=2*PI;
    while(dd<-PI) dd+=2*PI;
    arc2(APX,APY,aF,aG,40,T.fg,1.3);
    for(kk=0;kk<18;kk++)
      solidSeg(APX+Math.cos(aF+dd*kk/18)*40, APY+Math.sin(aF+dd*kk/18)*40,
               APX+Math.cos(aF+dd*(kk+1)/18)*40, APY+Math.sin(aF+dd*(kk+1)/18)*40);
    var am=aF+dd/2, ac=[], rr, kk;
    for(kk=0;kk<=2;kk++) for(rr=54;rr<=90;rr+=18)
      ac.push([APX+Math.cos(am+(kk===0?0:(kk===1?0.30:-0.30)))*rr,APY+Math.sin(am+(kk===0?0:(kk===1?0.30:-0.30)))*rr]);
    tryPutAway([{t:'\u03B1',v:true},' = ',nm(deg(s.alpha),1),'\u00B0'],13.5,T.fg,ac,APX,APY);
  }
  /* 标签按「位置越受限越先落位」排序：A′ → α → 端点字母 → 弦 → 矢量值。
     第 6 步矢量只留符号：数值已在第 4 步给出，末一步的画面重点是四边形本身。 */
  if(ST>=6){
    tryPut([{t:'F',v:true}],12.5,T.p1,tipLabel(s.Fx-APX,s.Fy-APY,s.Fx,s.Fy),'center','middle');
    tryPut([{t:'G',v:true}],12.5,T.p3,tipLabel(s.Gx-APX,s.Gy-APY,s.Gx,s.Gy),'center','middle');
  }
  if(ST>=5){
    tryPut([{t:'P',v:true}],13,T.p2,
      [[s.Px+18,s.Py-16],[s.Px-18,s.Py-16],[s.Px+18,s.Py+18],[s.Px-18,s.Py+18],
       [s.Px+31,s.Py-29],[s.Px-31,s.Py-29],[s.Px+31,s.Py+31],[s.Px-31,s.Py+31],
       [s.Px+45,s.Py-16],[s.Px-45,s.Py-16],[s.Px+45,s.Py+18],[s.Px-45,s.Py+18]],'center','middle');
  }
  if(ST>=6) tryPut([{t:'F',v:true},{t:'G',v:true},' = ',nm(s.FG,2)],14,T.p2,
    sideLabel(s.Fx,s.Fy,s.Gx,s.Gy),'center','middle');
  var lab1=(ST>=6)?[{t:'E',v:true},{t:'1',sub:true}]:[{t:'E',v:true},{t:'1',sub:true},' = ',nm(s.E1,2)];
  var lab2=(ST>=6)?[{t:'E',v:true},{t:'2',sub:true}]:[{t:'E',v:true},{t:'2',sub:true},' = ',nm(s.E2,2)];
  tipPut(lab1,14,T.p1,s.Fx-APX,s.Fy-APY,s.Fx,s.Fy);
  tipPut(lab2,14,T.p3,s.Gx-APX,s.Gy-APY,s.Gx,s.Gy);
  if(ST>=5) tipPut([{t:'E',v:true},' = ',nm(s.Emag,2)],14.5,T.p2,
    s.Px-APX,s.Py-APY,s.Px,s.Py);
  drawFormula(T,s);
}
/* 端点字母：优先放在箭头尖端之外，其次两侧 */
function tipLabel(vx,vy,tx,ty){
  var u=unit(vx,vy), nx=-u[1], ny=u[0], out=[], d, sgn;
  if(u[0]===0&&u[1]===0){ return [[tx+16,ty-16],[tx-16,ty-16],[tx+16,ty+18],[tx-16,ty+18]]; }
  var i,j;
  for(d=16;d<=46;d+=10) out.push([tx+u[0]*d,ty+u[1]*d]);
  for(d=18;d<=54;d+=12) for(sgn=-1;sgn<=1;sgn+=2) out.push([tx+nx*d*sgn,ty+ny*d*sgn]);
  for(i=10;i<=20;i+=10) for(j=16;j<=40;j+=12) for(sgn=-1;sgn<=1;sgn+=2)
    out.push([tx+u[0]*i+nx*j*sgn, ty+u[1]*i+ny*j*sgn]);
  return out;
}
/* 弦 FG 的标签：沿弦中点向两侧法向让开 */
function sideLabel(fx,fy,gx,gy){
  var u=unit(gx-fx,gy-fy), nx=-u[1], ny=u[0], mx=(fx+gx)/2, my=(fy+gy)/2, out=[], d;
  if(u[0]===0&&u[1]===0){ return [[mx,my-18],[mx,my+20]]; }
  if(nx*(mx-APX)+ny*(my-APY)<0){ nx=-nx; ny=-ny; }   /* 先试背离 A′ 的一侧（四边形外） */
  for(d=15;d<=45;d+=10) out.push([mx+nx*d,my+ny*d]);
  for(d=15;d<=35;d+=10) out.push([mx-nx*d,my-ny*d]);
  return out;
}

/* ================= 面板 ================= */
function row(k,html){ return '<div class=\'rl\'><span class=\'rk\'>'+k+'</span>'+html+'</div>'; }
function vsub(b,s){ return '<span class=\'v\'>'+b+'</span>'+(s?'<span class=\'v\'><sub>'+s+'</sub></span>':''); }
function num(s){ return '<span class=\'n\'>'+s+'</span>'; }
function dashv(){ return '<span class=\'n\'>\u2014</span>'; }
function hphi(k,v){ return vsub('\u03C6',k)+' = '+(v===null?dashv():num(nm(v,2))+' V'); }
function hlen(lab,v){ return lab+' = '+(v===null?dashv():num(nm(v,2))+' m'); }
function upd(){
  oE.textContent=nm(EM,1);
  oT.textContent=nm(TH,0)+'\u00B0';

    hlen(vsub('A')+vsub('B'),pts.length>=2?(s?s.d1:dist(pts[0],pts[1])):null)+' ｜ '+

    hlen(vsub('B')+vsub('C'),pts.length>=3?(s?s.d3:dist(pts[1],pts[2])):null));

    ((s&&ST>=4)?vsub('E','1')+' = '+num(nm(s.E1,2))+' V/m（沿 '+vsub('A')+vsub('B')+'）':vsub('E','1')+' = '+dashv())+' ｜ '+
    ((s&&ST>=4)?vsub('E','2')+' = '+num(nm(s.E2,2))+' V/m（沿 '+vsub('A')+vsub('C')+'）':vsub('E','2')+' = '+dashv())+' ｜ '+
    ((s&&ST>=4)?vsub('\u03B1')+' = '+num(nm(deg(s.alpha),1))+'\u00B0':vsub('\u03B1')+' = '+dashv()));
  h+=row('合成',
    ((s&&ST>=6)?vsub('F')+vsub('G')+' = '+num(nm(s.FG,2))+' V/m':vsub('F')+vsub('G')+' = '+dashv())+' ｜ '+
    ((s&&ST>=6)?vsub('A')+'<span class=\'n\'>\u2032</span>'+vsub('P')+' = '+num(nm(s.Ecalc,2))+' V/m':vsub('A')+'<span class=\'n\'>\u2032</span>'+vsub('P')+' = '+dashv())+' ｜ '+
    ((s&&ST>=5)?'方向 '+vsub('\u03B8')+' = '+num(nm(s.Eth,1))+'\u00B0':'方向 '+vsub('\u03B8')+' = '+dashv()));
  if(showAns) h+=row('答案','真实 '+vsub('E')+' = '+num(nm(EM,1))+' V/m，'+vsub('\u03B8')+' = '+num(nm(TH,0))+'\u00B0');
  rd.innerHTML=h;

  rule.innerHTML='两段距离与三点电势给出两个方向上的分场 '+vsub('E','1')+'、'+vsub('E','2')+
    '（负值表示与所取方向相反）；过它们的末端作垂线定出总场方向，再由圆内接四边形按 '+
    vsub('A')+'<span class=\'n\'>\u2032</span>'+vsub('P')+' = '+vsub('F')+vsub('G')+' / sin '+vsub('\u03B1')+
    ' 算出大小。两条方向线越接近垂直，交点越准。';

  var msg;
  if(pts.length<3) msg='第 '+['一','二','三'][pts.length]+'个点：点击场区图任取。';
  else if(ST===3) msg='三点齐备。点「下一步」求两个分场。';
  else if(ST===4) msg='两条分场矢量已画出。点「下一步」过末端作垂线找交点。';
  else if(ST===5) msg='交点 '+vsub('P')+' 已定，'+vsub('A')+'<span class=\'n\'>\u2032</span>'+vsub('P')+
    ' 即总场矢量。点「下一步」用圆内接四边形算大小。';
  else msg='共圆关系给出 '+vsub('A')+'<span class=\'n\'>\u2032</span>'+vsub('P')+' = '+
    vsub('F')+vsub('G')+' / sin '+vsub('\u03B1')+'，与作图量得的长度一致。';
  if(s&&s.warn) msg+='　<span class=\'warn\'>'+s.warn+'</span>';

  if(pts.length>=3&&SOL&&ST<6) bNext.classList.add('on'); else bNext.classList.remove('on');

/* ================= 交互 ================= */
function refresh(){ solve(); upd(); dirty=true; }
sE.addEventListener('input',function(){ EM=parseFloat(sE.value); updField(); refresh(); });
sT.addEventListener('input',function(){ TH=parseFloat(sT.value); updField(); refresh(); });
bNext.addEventListener('click',function(){ if(pts.length<3||!SOL) return; if(ST<6) ST++; refresh(); });
bPrev.addEventListener('click',function(){
  if(ST>3) ST--;
  else if(ST>0){ pts.pop(); ST=pts.length; }
  refresh();
});
bClear.addEventListener('click',function(){ pts=[]; ST=0; drag=-1; refresh(); });
kAns.addEventListener('change',function(){ showAns=!!kAns.checked; refresh(); });

function evPos(e,cv,LWv,LHv){
  var r=cv.getBoundingClientRect();
  var w=r.width||900, h=r.height||400;
  return [(e.clientX-r.left)*LWv/w,(e.clientY-r.top)*LHv/h];
}
function toWorld(x,y){ return {x:clamp((x-OXA)/S,0,WX), y:clamp((OYA-y)/S,0,WY)}; }
cvA.addEventListener('pointerdown',function(e){
  var p=evPos(e,cvA,LWA,LHA), i, best=-1, bd=16, d;
  for(i=0;i<pts.length;i++){
    d=Math.sqrt((XA(pts[i].x)-p[0])*(XA(pts[i].x)-p[0])+(YA(pts[i].y)-p[1])*(YA(pts[i].y)-p[1]));
    if(d<bd){ bd=d; best=i; }
  }
  if(best>=0) drag=best;
  else if(pts.length<3){ pts.push(toWorld(p[0],p[1])); ST=pts.length; drag=pts.length-1; }
  else return;
  if(e.preventDefault) e.preventDefault();
  refresh();
});
cvA.addEventListener('pointermove',function(e){
  if(drag<0) return;
  var p=evPos(e,cvA,LWA,LHA);
  pts[drag]=toWorld(p[0],p[1]);
  refresh();
});
function endDrag(){ if(drag>=0){ drag=-1; refresh(); } }
cvA.addEventListener('pointerup',endDrag);
cvA.addEventListener('pointercancel',endDrag);
cvA.addEventListener('pointerleave',endDrag);

/* ================= 画布尺寸 ================= */
function fit(cv,LWv,LHv){
  var r=cv.getBoundingClientRect(), w=Math.max(320,r.width||900);
  var ss=Math.max(window.devicePixelRatio||1,2);
  var h=Math.round(LHv*w/LWv);
  cv.style.height=h+'px';
  cv.width=Math.round(w*ss); cv.height=Math.round(h*ss);
  cv.getContext('2d').setTransform(cv.width/LWv,0,0,cv.height/LHv,0,0);
}
function resize(){ fit(cvA,LWA,LHA); fit(cvB,LWB,LHB); dirty=true; }

/* ================= 主循环 ================= */
function step(){ if(dirty){ dirty=false; draw(); } requestAnimationFrame(step); }
function draw(){ var T=theme(); HALO=T.bg; drawA(T); drawB(T); }

window.addEventListener('resize',resize);
if(D.fonts){ D.fonts.load('italic 14px KaTeX_Math'); D.fonts.load('14px KaTeX_Main'); }
EM=parseFloat(sE.value); TH=parseFloat(sT.value);
updField();
pts=[];/*INITPTS*/
ST=0;
showAns=!!kAns.checked;
resize(); refresh();
requestAnimationFrame(step);
})();
