<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静止卫星与地面的相对静止</title>
<style>
  :root {
    --bg: #fdfdfb; --fg: #2b2b2b; --muted: #77776f;
    --grid: #d9d9d2; --earth-fill: #dbe9f4; --earth-line: #6f9dbf;
    --meridian: #8fb4cf; --geo: #b8432f; --leo: #2f855a;
    --panel: #f4f4ef; --line: #d5d5cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124; --fg: #e6e6e2; --muted: #9a9a92;
      --grid: #3c3c38; --earth-fill: #2c4256; --earth-line: #6f9dbf;
      --meridian: #4a6f8c; --geo: #e07a5f; --leo: #7cc49a;
      --panel: #2a2a2e; --line: #45454a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 940px; padding: 8px 12px 20px; }
  canvas { width: 100%; height: auto; display: block; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding: 10px 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; margin-top: 10px; font-size: 14px;
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .group .label { color: var(--muted); }
  button {
    font: inherit; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .readout { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .caption { margin-top: 12px; font-size: 14px; line-height: 1.8; color: var(--fg); }
  .caption b.geo { color: var(--geo); }
  .caption b.leo { color: var(--leo); }
  .caption .note { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv" width="920" height="600"></canvas>
  <div class="bar">
    <div class="group">
      <button id="btnPlay">暂停</button>
    </div>
    <div class="group">
      <span class="label">速度</span>
      <button class="spd" data-v="500">慢</button>
      <button class="spd active" data-v="1000">中</button>
      <button class="spd" data-v="2000">快</button>
    </div>
    <div class="group">
      <span class="label">参考系</span>
      <button class="frame active" data-f="geo">地心系</button>
      <button class="frame" data-f="ground">地面系</button>
    </div>
    <div class="readout" id="readout"></div>
  </div>
  <div class="caption">
    视角：俯视北极，画面即赤道面。地心系里地球每 <i>T</i> = 24 h 转一圈，<b class="geo">静止卫星</b>以同一角速度 ω<sub>0</sub> 绕行，连线始终指向同一方向；切换到地面系，地球静止、星空反向转动，卫星就固定在赤道观察者正上方。
    <span class="note">（<b class="leo">对比卫星</b>在近地轨道，约 90 min 一圈，两个参考系里都明显跑得快。）</span>
  </div>
</div>

<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const CX = 460, CY = 300;
  const R_EARTH = 54;
  const R_GEO   = 264;
  const R_LEO   = 116;
  const OMEGA0    = 2 * Math.PI / 86400;   // 地球自转
  const OMEGA_LEO = 2 * Math.PI / 5400;    // 近地卫星 90 min

  let simT = 0;
  let speed = 1000;
  let playing = true;
  let lastTs = null;
  let trail = [];              // 近地卫星在该参考系下的轨迹
  let frame = 'geo';           // 'geo' 地心系 | 'ground' 地面系

  const stars = [];
  for (let i = 0; i < 110; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 70 + Math.random() * 200;
    stars.push({ x: CX + r * Math.cos(a), y: CY + r * Math.sin(a), s: 0.7 + Math.random() * 1.1 });
  }

  const btnPlay = document.getElementById('btnPlay');
  btnPlay.addEventListener('click', () => {
    playing = !playing;
    btnPlay.textContent = playing ? '暂停' : '播放';
  });
  document.querySelectorAll('.spd').forEach(b => b.addEventListener('click', () => {
    speed = +b.dataset.v;
    document.querySelectorAll('.spd').forEach(x => x.classList.toggle('active', x === b));
  }));
  document.querySelectorAll('.frame').forEach(b => b.addEventListener('click', () => {
    frame = b.dataset.f;
    trail = [];
    document.querySelectorAll('.frame').forEach(x => x.classList.toggle('active', x === b));
  }));

  const readout = document.getElementById('readout');

  // 支持用 #ground 直接打开地面系，#t=秒数 设定初始模拟时间，可组合：#ground&t=7200
  if (location.hash.includes('ground')) {
    frame = 'ground';
    document.querySelectorAll('.frame').forEach(x => x.classList.toggle('active', x.dataset.f === 'ground'));
  }
  const mHash = location.hash.match(/t=(\d+)/);
  if (mHash) simT = +mHash[1];

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // 地面系：整体反向旋转 theta
  function makeRot(off) {
    const c = Math.cos(off), s = Math.sin(off);
    return (x, y) => {
      const dx = x - CX, dy = y - CY;
      return { x: CX + dx * c - dy * s, y: CY + dx * s + dy * c };
    };
  }

  function drawStars(rot, col) {
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.45;
    for (const st of stars) {
      const p = rot(st.x, st.y);
      ctx.beginPath();
      ctx.arc(p.x, p.y, st.s, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbit(r, col) {
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, 2 * Math.PI);
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 极轴俯视的地球：纬圈为同心圆、经线为辐射线，最外圈即赤道
  // ea：网格在屏幕上的转角（地心系随地球转，地面系恒为 0）
  function drawEarth(ea) {
    const fill = css('--earth-fill'), line = css('--earth-line');
    const mer = css('--meridian'), muted = css('--muted');

    const grad = ctx.createRadialGradient(CX - 16, CY - 16, 6, CX, CY, R_EARTH);
    grad.addColorStop(0, fill);
    grad.addColorStop(1, line);
    ctx.beginPath();
    ctx.arc(CX, CY, R_EARTH, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();

    // 经线：自极点向外辐射
    ctx.strokeStyle = mer;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.75;
    for (let k = 0; k < 12; k++) {
      const a = ea + k * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(CX + 0.16 * R_EARTH * Math.cos(a), CY + 0.16 * R_EARTH * Math.sin(a));
      ctx.lineTo(CX + R_EARTH * Math.cos(a), CY + R_EARTH * Math.sin(a));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 纬圈：±30°、±60°
    [30, 60].forEach(lat => {
      const r = R_EARTH * Math.cos(lat * Math.PI / 180);
      ctx.beginPath();
      ctx.arc(CX, CY, r, 0, 2 * Math.PI);
      ctx.strokeStyle = mer;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // 赤道：最外圈，加粗
    ctx.beginPath();
    ctx.arc(CX, CY, R_EARTH, 0, 2 * Math.PI);
    ctx.strokeStyle = line;
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // 极点与视角标注
    ctx.fillStyle = muted;
    ctx.font = '11px "Noto Sans SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('北极', CX, CY + 4);
    ctx.textAlign = 'left';
    ctx.fillText('俯视北极，画面即赤道面', CX + R_EARTH + 8, CY - R_EARTH + 4);

    // 赤道标注：圈外左下角引一条短线
    const ax = CX + (R_EARTH + 4) * Math.cos(Math.PI * 0.72);
    const ay = CY + (R_EARTH + 4) * Math.sin(Math.PI * 0.72);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 14, ay + 12);
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.fillStyle = line;
    ctx.font = '12px "Noto Sans SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('赤道', ax - 16, ay + 24);
  }

  // 观察者：赤道圈上的一点，位置由参考系决定
  function drawObserver(x, y) {
    const fg = css('--fg'), fill = css('--earth-fill');
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.strokeStyle = fill;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const ang = Math.atan2(y - CY, x - CX);
    const lx = x + 22 * Math.cos(ang) - 14 * Math.sin(ang);
    const ly = y + 22 * Math.sin(ang) + 14 * Math.cos(ang) + 4;
    ctx.fillStyle = fg;
    ctx.font = '13px "Noto Sans SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = Math.cos(ang) > -0.3 ? 'left' : 'right';
    ctx.fillText('观察者', lx, ly);
  }

  function drawSatellite(x, y, ang, color, label, sub, labOff) {
    labOff = labOff || 0;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(-17, -3, 9, 6);
    ctx.fillRect(8, -3, 9, 6);
    ctx.globalAlpha = 1;
    ctx.fillRect(-4, -4, 8, 8);
    ctx.restore();

    ctx.fillStyle = color;
    ctx.font = '13px "Noto Sans SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x, y - 14 - labOff);
    if (sub) {
      ctx.fillStyle = css('--muted');
      ctx.font = '12px "Noto Sans SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(sub, x, y + 24 + labOff);
    }
  }

  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.1);
    lastTs = ts;
    if (playing) simT += dt * speed;

    const theta = OMEGA0 * simT;
    const thetaL = OMEGA_LEO * simT;

    ctx.clearRect(0, 0, cv.width, cv.height);

    const rot = makeRot(frame === 'ground' ? -theta : 0);
    const geo = css('--geo'), leo = css('--leo');

    drawStars(rot, css('--muted'));
    drawOrbit(R_GEO, css('--grid'));
    drawOrbit(R_LEO, css('--grid'));

    // 近地卫星、观察者、静止卫星的空间位置：观察者与静止卫星都在 θ 方向
    const lp = rot(CX + R_LEO * Math.cos(thetaL), CY + R_LEO * Math.sin(thetaL));
    const op = rot(CX + R_EARTH * Math.cos(theta), CY + R_EARTH * Math.sin(theta));
    const gp = rot(CX + R_GEO * Math.cos(theta),   CY + R_GEO * Math.sin(theta));

    trail.push({ x: lp.x, y: lp.y });
    if (trail.length > 90) trail.shift();
    ctx.beginPath();
    trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = leo;
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.globalAlpha = 1;

    drawEarth(theta + (frame === 'ground' ? -theta : 0));

    // 观察者到卫星的连线：两参考系中都是同一条径向线
    ctx.beginPath();
    ctx.moveTo(op.x, op.y);
    ctx.lineTo(gp.x, gp.y);
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = geo;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    drawObserver(op.x, op.y);
    drawSatellite(lp.x, lp.y, thetaL + (frame === 'ground' ? -theta : 0), leo, '对比卫星 / 近地', null);
    drawSatellite(gp.x, gp.y, theta + (frame === 'ground' ? -theta : 0), geo, '静止卫星',
      frame === 'ground' ? '相对地面：位置不变' : '与地面点同角速度 ω₀',
      frame === 'ground' ? 18 : 0);

    // 地面系里给静止卫星加固定位置框，凸显"钉住不动"
    if (frame === 'ground') {
      ctx.strokeStyle = geo;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1;
      ctx.strokeRect(gp.x - 24, gp.y - 24, 48, 48);
      ctx.globalAlpha = 1;
    }

    const h = simT / 3600, rev = simT / 86400;
    readout.textContent = (frame === 'ground' ? '地面系｜' : '地心系｜') +
      't = ' + h.toFixed(1) + ' h｜地球自转 ' + rev.toFixed(2) +
      ' 圈，静止卫星公转 ' + rev.toFixed(2) + ' 圈｜对比卫星已绕 ' + (simT / 5400).toFixed(2) + ' 圈';

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
