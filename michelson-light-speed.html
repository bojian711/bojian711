:root{--bg:#f8f8f4;--paper:#fffefa;--fg:#293435;--muted:#536464;--border:#d5ddd6;--axis:#71827e;--accent:#28645b;--accent-text:#fff;--tint:#e6f0eb;--warm:#9e562b;--metal:#e7eae4}
@media(prefers-color-scheme:dark){:root{--bg:#191f21;--paper:#222a2d;--fg:#ebf1ed;--muted:#bdc9c4;--border:#47534f;--axis:#9baea7;--accent:#a4d6c1;--accent-text:#172d27;--tint:#2a3d36;--warm:#eeb284;--metal:#3d4947}}
*{box-sizing:border-box}
body{margin:0;border:none;background:var(--bg);color:var(--fg);font:clamp(13px,1.75vw,15px)/1.5 'Microsoft YaHei','PingFang SC',system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:14px clamp(10px,2vw,20px) 17px}
h1,h2,p,figure{margin:0}
h1{font-size:clamp(19px,3.2vw,27px);line-height:1.25}
h2{font-size:clamp(16px,2.35vw,20px);line-height:1.35;margin:1px 0 4px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
button,input,output{font:inherit}
button{cursor:pointer;padding:5px 9px;border:1px solid var(--border);border-radius:7px;background:var(--paper);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
button:disabled{color:var(--muted);background:var(--metal);border-color:var(--border);cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
#reset{white-space:nowrap;font-size:12px}
progress{width:100%;height:5px;display:block;accent-color:var(--accent);margin:0 0 7px}
.setup,.muted{color:var(--muted);font-size:clamp(12px,1.55vw,14px)}
.setup{margin-bottom:6px}
.math,output{font-family:'KaTeX_Main',Georgia,serif}

<body>
<main>
  <header><h1>迈克尔逊的旋转棱镜法</h1><button type='button' id='reset'>重新实验</button></header>
  <p class='setup' id='setup'></p>

  <section class='intro' aria-labelledby='step-title'>
    <div id='step-count'></div><h2 id='step-title' aria-live='polite'></h2><p id='instructions'></p>
  </section>
<div class='lab-shell'>
  <section class='controls' aria-labelledby='step-title'>
    <div id='speed-panel' hidden>
      <div class='frequency-row'><label for='speed'>转速 <em class='math'>f</em></label><output id='frequency' for='speed'></output></div>
      <input id='speed' type='range' aria-describedby='instructions'>
      <div class='adjust'>
        <button type='button' id='less'></button>
        <p>微调（圈/s）</p>
        <button type='button' id='more'></button>
      </div>
    </div>
    <dl id='calculation' hidden></dl>
    <div class='actions' id='actions'>
      <button type='button' id='main-action' class='primary'>发射一束光</button>
      <button type='button' id='replay' hidden>再看一次往返</button>
    </div>
    <p id='feedback' role='status' aria-live='polite'></p>
  </section>
  <section class='apparatus' aria-label='三维光路和八面镜'>
    <figure class='scene-card'>
      <figcaption><strong>图 18.5 光路</strong><span id='path-stage'>待发射</span></figcaption>
      <canvas id='scene' role='img' aria-label='光源 S 穿过狭缝 O，经八面镜 A 的面 1 射向凹镜 B。光依次经 B、平面镜 M、B 返回八面镜，最后射向望远镜 C。'></canvas>
    </figure>
    <div class='detail-key'>
      <span class='slot-key'>面 2</span><span class='axis-key'>当前反射面</span>

    </div>
    <figure class='scene-card compare'>
      <figcaption><strong>出射时</strong><span>拖动两图可转动视角</span></figcaption>
      <canvas id='departure' tabindex='0' role='img' aria-label='八面镜 A 的面 1 将入射光向左反射。面 2 在左，面 3 在左下。左右键转动视角。'></canvas>
    </figure>
    <figure class='scene-card compare'>
      <figcaption><strong id='return-title'>等待回光</strong><span id='return-detail'>与上图同视角</span></figcaption>
      <canvas id='arrival' tabindex='0' role='img' aria-label='回光到达八面镜。静止时面 3 接到回光，转过 45 度时面 2 接替面 3。左右键转动视角。'></canvas>
      <div class='arc-caption'><span id='arc-label'>八面镜转过的角度</span><output id='arc-distance' aria-labelledby='arc-label'>—</output></div>
    </figure>
  </section>

    <figcaption><strong>望远镜 C</strong><span id='light-state'>等待回光</span></figcaption>

  </figure>
</div>

</main>
<script>
'use strict';

const optics = (() => {
  const airSpeed = 299792458 / 1.00027;
  const experiments = Object.freeze({
    fizeau: Object.freeze({ distance: 8630, count: 720, radius: 0.10, scale: 2, min: 0, max: 26, step: 0.01, initial: 5 }),
    michelson: Object.freeze({ distance: 35373.21, count: 8, scale: 1, min: 0, max: 650, step: 0.1, initial: 120, reference: 528 })
  });
  const degrees = value => value * 180 / Math.PI;

  function michelsonReturn(phase, radius) {
    const step = 2 * Math.PI / experiments.michelson.count;
    const z = radius / Math.sqrt(2);
    let hitX = -Infinity;
    let face = 0;
    let normalX = 0;
    let normalZ = 0;
    // Return beam travels along +x at a fixed z. Find the first face of the convex prism it meets.
    for (let i = 0; i < experiments.michelson.count; i++) {
      const angle = 5 * Math.PI / 4 + phase + i * step;
      const nx = Math.cos(angle);
      const nz = -Math.sin(angle);
      if (nx >= -1e-12) continue;
      const x = (radius - z * nz) / nx;
      if (x > hitX) {
        hitX = x;
        face = i;
        normalX = nx;
        normalZ = nz;
      }
    }
    const reflectedX = 1 - 2 * normalX ** 2;
    const reflectedZ = -2 * normalX * normalZ;
    return { x: hitX, z, face, reflectedX, reflectedZ, angle: Math.atan2(reflectedX, reflectedZ) };
  }

  function michelsonRemote(vertex, radius, halfSeparation) {
    const adjacent = Math.sqrt(radius ** 2 - halfSeparation ** 2);
    const x = vertex + radius - adjacent;
    const nx = adjacent / radius;
    const nz = halfSeparation / radius;
    const focusX = x + halfSeparation * (2 * nx ** 2 - 1) / (2 * nx * nz);
    return { x, focusX };
  }

  function observe(kind, frequency, mediumSpeed) {
    const apparatus = experiments[kind];
    // The textbook supplies the first return frequency and the mountaintop distance.
    mediumSpeed ??= kind === 'michelson' ? michelsonFromAngle(apparatus.reference).speed : airSpeed;
    const time = 2 * apparatus.distance / mediumSpeed;
    const revolutions = frequency * time;
    const pitchTravel = apparatus.count * revolutions;
    const residualPitches = pitchTravel - Math.round(pitchTravel);
    const relativeLight = 1 - 2 * Math.abs(residualPitches);
    // The return ray deviates by twice the normal's angular mismatch.
    const angularOffset = kind === 'michelson' ? michelsonReturn(2 * Math.PI * revolutions, 1).angle
      : 4 * Math.PI * residualPitches / apparatus.count;
    const aligned = kind === 'fizeau'
      ? Math.abs(pitchTravel - 0.5) <= 0.0045
      : Math.abs(pitchTravel - 1) <= 0.004;
    return { time, revolutions, pitchTravel, relativeLight, angularOffset, aligned };
  }

  function measure(kind, frequency) {
    const { distance, count, scale } = experiments[kind];
    const turns = 1 / (scale * count);
    const time = turns / frequency;
    return { turns, time, length: 2 * distance, speed: 2 * distance / time };
  }

  function fizeauFromArc(frequency) {
    const { radius, distance, count } = experiments.fizeau;
    const arc = Math.PI * radius / count;
    const angularSpeed = 2 * Math.PI * frequency;
    const rimSpeed = radius * angularSpeed;
    const time = arc / rimSpeed;
    const length = 2 * distance;
    return { arc, angularSpeed, rimSpeed, time, length, speed: length / time };
  }

  function michelsonFromAngle(frequency) {
    const { count, distance } = experiments.michelson;
    const turnAngle = 2 * Math.PI / count;
    const angularSpeed = 2 * Math.PI * frequency;
    const time = turnAngle / angularSpeed;
    const length = 2 * distance;
    return { turnAngle, angularSpeed, time, length, speed: length / time };
  }

  return { experiments, observe, measure, degrees, fizeauFromArc, michelsonFromAngle, michelsonReturn, michelsonRemote };
})();


const spatialGraphics = (() => {
  const palette = {
    background: '#10191d', text: '#e7efec', muted: '#a9bfba', line: '#617c80',
    slot: '#7be2d4', path: '#ffca77', core: '#fff5d4',
    steel: [170, 190, 192], bench: [67, 91, 97], mirror: [124, 190, 198]
  };
  const point = (x, y, z) => ({ x, y, z });
  const minus = (a, b) => point(a.x - b.x, a.y - b.y, a.z - b.z);
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const cross = (a, b) => point(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  function projectFrom(yaw, elevation, centerX, centerY) {
    const cx = Math.cos(yaw);
    const sx = Math.sin(yaw);
    const cy = Math.cos(elevation);
    const sy = Math.sin(elevation);
    const right = point(cx, 0, -sx);
    const up = point(-sx * sy, cy, -cx * sy);
    const toward = point(sx * cy, sy, cx * cy);
    return world => ({
      x: centerX + dot(world, right),
      y: centerY - dot(world, up),
      z: dot(world, toward)
    });
  }

  function canvasFrame(canvas, width, height) {
    const rect = canvas.getBoundingClientRect();
    const sample = Math.max(window.devicePixelRatio || 1, 2);
    const w = Math.round(rect.width * sample);
    const h = Math.round(rect.height * sample);
    if (!w || !h) return null;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = palette.background;
    ctx.fillRect(0, 0, w, h);
    const scale = Math.min(w / width, h / height);
    ctx.setTransform(scale, 0, 0, scale, (w - width * scale) / 2, (h - height * scale) / 2);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    return ctx;
  }

  function stroke(ctx, a, b, color, width) {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function disc(ctx, x, y, r, fill) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function words(ctx, text, x, y, color = palette.text, size = 15, align = 'center') {
    ctx.font = size + 'px Microsoft YaHei, system-ui, sans-serif';
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function beam(ctx, a, b, strength = 1) {
    if (strength <= 0) return;
    ctx.save();
    ctx.globalAlpha = strength * .24;
    stroke(ctx, a, b, palette.path, 9.0);
    ctx.globalAlpha = strength * .7;
    stroke(ctx, a, b, palette.path, 3.6);
    ctx.globalAlpha = strength;
    stroke(ctx, a, b, palette.core, 1.35);
    ctx.restore();
  }

  function depthFaces(faces, back, front, material) {
    faces.push({ vertices: back.slice().reverse(), material }, { vertices: front, material });
    for (let i = 0; i < front.length; i++) {
      const j = (i + 1) % front.length;
      faces.push({ vertices: [back[i], back[j], front[j], front[i]], material });
    }
  }

  function box(faces, min, max, material) {
    const profile = [point(min.x, min.y, 0), point(max.x, min.y, 0),
      point(max.x, max.y, 0), point(min.x, max.y, 0)];
    depthFaces(faces, profile.map(p => point(p.x, p.y, min.z)),
      profile.map(p => point(p.x, p.y, max.z)), material);
  }

  function paintFaces(ctx, project, faces) {
    const sorted = faces.map(({ vertices, material }) => {
      const projected = vertices.map(project);
      const n = cross(minus(vertices[1], vertices[0]), minus(vertices[2], vertices[0]));
      const length = Math.hypot(n.x, n.y, n.z);
      const light = length ? (.24 * n.x + .72 * n.y + .65 * n.z) / length : 0;
      const depth = projected.reduce((sum, p) => sum + p.z, 0) / projected.length;
      return { projected, depth, light, material };
    }).sort((a, b) => a.depth - b.depth);

    for (const { projected, light, material } of sorted) {
      const [first, ...rest] = projected;
      ctx.beginPath();
      ctx.moveTo(first.x, first.y);
      for (const p of rest) ctx.lineTo(p.x, p.y);
      ctx.closePath();

      const yRange = projected.map(p => p.y);
      const lo = Math.min(...yRange);
      const hi = Math.max(...yRange);
      const brightness = .57 + .34 * Math.max(0, light);
      const tint = value => 'rgb(' + material.map(v => Math.round(v * value)).join(',') + ')';
      const fill = ctx.createLinearGradient(0, lo, 0, Math.max(lo + 1, hi));
      fill.addColorStop(0, tint(brightness + .10));
      fill.addColorStop(1, tint(brightness - .04));
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = 'rgba(18,31,34,.87)';
      ctx.lineWidth = .67;
      ctx.stroke();
    }
  }

  return { palette, point, clamp, projectFrom, canvasFrame, stroke, disc, words, beam, depthFaces, box, paintFaces };
})();

function createMichelsonScene() {
  const byId = id => document.getElementById(id);
  const overview = byId('scene');
  const departure = byId('departure');
  const arrival = byId('arrival');
  const detector = byId('detector');
  const pathStage = byId('path-stage');
  const returnTitle = byId('return-title');
  const returnDetail = byId('return-detail');
  const angleLabel = byId('arc-label');
  const angleReading = byId('arc-distance');
  const lightState = byId('light-state');
  const { palette, point, clamp, projectFrom, canvasFrame, stroke, disc, words, beam, box, paintFaces } = spatialGraphics;
  const { count } = optics.experiments.michelson;
  const faceAngle = 2 * Math.PI / count;
  const baseline = 5 * Math.PI / 4;
  const halfField = 4 * Math.PI / 180;
  const faceTwo = [74, 170, 157];
  const lightFace = [220, 171, 100];
  const view = { yaw: -.29, elevation: .86 };
  const initialYaw = view.yaw;
  let snapshot;
  let drag;

  const planePoint = (angle, radius, y = 0) => point(radius * Math.cos(angle), y, -radius * Math.sin(angle));
  const move = (p, x, y, z) => point(p.x + x, p.y + y, p.z + z);
  const faceNumbers = [{ index:6, number:1, color:palette.path },{ index:7, number:2, color:palette.slot },{ index:0, number:3, color:'#c5ddf1' }];
  const numberFace = index => faceNumbers.find(face=>face.index===index)?.number;

  function prism(faces, { phase, active, radius, height, x = 0, y = 0, z = 0, highlighted = true }) {
    const vertexRadius = radius / Math.cos(faceAngle / 2);
    const edge = Array.from({ length: count }, (_, i) => planePoint(baseline + phase + (i - .5) * faceAngle, vertexRadius));
    const top = edge.map(p => move(p, x, y + height, z));
    const bottom = edge.map(p => move(p, x, y - height, z));
    faces.push({ vertices: top, material: [98, 121, 128] });
    for (let i = 0; i < count; i++) {
      const next = (i + 1) % count;
      const material = highlighted && i === active ? lightFace : highlighted && i === 7 ? faceTwo : palette.steel;
      faces.push({ vertices: [top[i], bottom[i], bottom[next], top[next]], material });
    }
  }

  function rayToFace(radius, phase) {
    const trace = optics.michelsonReturn(phase, radius);
    return { hit:point(trace.x,0,trace.z), reflected:point(trace.reflectedX,0,trace.reflectedZ), face:trace.face };
  }

  function polyline(ctx, project, vertices, color, thickness) {
    for (let i = 1; i < vertices.length; i++) stroke(ctx, project(vertices[i - 1]), project(vertices[i]), color, thickness);
  }

  function lineOfSight(ctx, project, radius, phase, returned, isDeparture) {
    const offset = radius / Math.sqrt(2);
    if (isDeparture) {
      const a = point(-offset, 0, -offset);
      beam(ctx, project(point(-offset, 0, -100)), project(a));
      beam(ctx, project(a), project(point(-190, 0, -offset)));
      return;
    }
    const reference = point(-offset, 0, offset);
    ctx.setLineDash([5, 5]);
    stroke(ctx, project(reference), project(point(-offset, 0, 105)), palette.line, 1.4);
    ctx.setLineDash([]);
    if (!returned) return;
    const { hit, reflected } = rayToFace(radius, phase);
    const extension = (113 - hit.z) / reflected.z;
    beam(ctx, project(point(-185, 0, hit.z)), project(hit));
    beam(ctx, project(hit), project(move(hit, reflected.x * extension, 0, reflected.z * extension)));
    disc(ctx, project(hit).x, project(hit).y, 3.1, palette.core);
  }

  function drawSweep(ctx, project, phase, y) {
    const mark = theta => project(planePoint(baseline - faceAngle + theta, 87, y));
    const center = project(point(0, y, 0));
    const start = mark(0);
    let previous = start;
    ctx.setLineDash([3, 4]);
    stroke(ctx, center, start, palette.line, 1.1);
    ctx.setLineDash([]);
    for (let i = 1; i <= 16; i++) {
      const p = mark(phase * i / 16);
      stroke(ctx, previous, p, palette.slot, 2.0);
      previous = p;
    }
    stroke(ctx, center, previous, palette.slot, 1.2);
    const mid = mark(phase / 2);
    words(ctx, 'Δθ', mid.x - 18, mid.y + 16, palette.slot, 21);
  }

  function faceMarks(ctx, project, phase, radius, y, size) {
    for (const {index,number,color} of faceNumbers) {
      const p = project(planePoint(baseline + phase + index * faceAngle, radius * .79, y));
      words(ctx, String(number), p.x, p.y, color, size);
    }
  }

  function compare(canvas, phase, isDeparture, returned) {
    const ctx = canvasFrame(canvas, 650, isDeparture ? 153 : 178);
    if (!ctx) return;
    const project = projectFrom(view.yaw, view.elevation, 310, 93);
    const radius = 56;
    const height = 24;
    const active = isDeparture ? 6 : returned ? rayToFace(radius, phase).face : -1;
    const faces = [];
    prism(faces, { phase, active, radius, height });
    paintFaces(ctx, project, faces);
    lineOfSight(ctx, project, radius, phase, returned, isDeparture);
    if (!isDeparture && returned && phase > 0) drawSweep(ctx, project, phase, height);
    faceMarks(ctx, project, phase, radius, height, 22);
  }

  const launchAt = .095;
  const returnAt = .91;

  function drawOverview(state, phase, finalPhase) {
    const ctx = canvasFrame(overview, 650, 188);
    if (!ctx) return;
    const project = projectFrom(-.045, .88, 321, 93);
    const x = 209;
    const y = 0;
    const radius = 31;
    const edge = radius / Math.sqrt(2);
    const mirrorVertex = -244;
    const mirrorRadius = 110;
    const remote = optics.michelsonRemote(mirrorVertex,mirrorRadius,edge);
    const source = point(x-edge,y,-98);
    const slit = point(x-edge,y,-69);
    const outgoing = point(x-edge,y,-edge);
    const farUpper = point(remote.x,y,-edge);
    const plane = point(remote.focusX,y,0);
    const farLower = point(remote.x,y,edge);
    const reference = point(x-edge,y,edge);
    const scope = point(x-edge,y,94);
    const trace = rayToFace(radius,finalPhase);
    const hit = move(trace.hit,x,y,0);
    const direction = trace.reflected;
    const length = Math.min(105,(scope.z-hit.z)/direction.z);
    const endpoint = move(hit,direction.x*length,0,direction.z*length);
    const faces = [];
    const mirror = z => mirrorVertex + mirrorRadius - Math.sqrt(mirrorRadius ** 2 - z ** 2);
    for (let z=-40;z<40;z+=4) {
      const a = mirror(z);
      const b = mirror(z+4);
      faces.push({ vertices:[point(a,-18,z),point(a,18,z),point(b,18,z+4),point(b,-18,z+4)],material:palette.mirror });
    }
    box(faces,point(plane.x-2,-14,-8),point(plane.x+2,14,8),palette.mirror);
    for (const sign of [-1,1]) {
      const edgeX = slit.x+sign*7;
      box(faces,point(edgeX-5,-11,slit.z-2),point(edgeX+5,11,slit.z+2),palette.steel);
    }
    box(faces,point(scope.x-14,-10,scope.z-9),point(scope.x+14,10,scope.z+16),palette.bench);
    box(faces,point(scope.x-10,-8,scope.z-12),point(scope.x+10,8,scope.z-9),palette.mirror);
    const active = state.progress < launchAt ? 6 : state.progress >= returnAt ? trace.face : -1;
    prism(faces,{phase,active,radius,height:16,x,y});
    paintFaces(ctx,project,faces);
    const sourcePoint = project(source);
    disc(ctx,sourcePoint.x,sourcePoint.y,5.1,palette.path);
    polyline(ctx,project,[source,slit,outgoing,farUpper,plane,farLower,reference,scope],palette.line,1.05);

    const route = [source,slit,outgoing,farUpper,plane,farLower,hit,endpoint];
    const breaks = [0,.043,launchAt,.46,.5,.54,returnAt,1];
    if (state.playing || state.progress === 1) {
      let moving;
      for (let index=1;index<route.length;index++) {
        const start = route[index-1];
        const end = route[index];
        const ratio = clamp((state.progress-breaks[index-1])/(breaks[index]-breaks[index-1]),0,1);
        if (!ratio) break;
        moving = point(start.x+(end.x-start.x)*ratio,y,start.z+(end.z-start.z)*ratio);
        beam(ctx,project(start),project(moving),ratio===1 ? .71 : .94);
        if (ratio<1) break;
      }
      if (moving && state.playing) {
        const pulse = project(moving);
        disc(ctx,pulse.x,pulse.y,3.6,palette.core);
      }
    }
    faceMarks(ctx,projectFrom(-.045,.88,321+x,93),phase,radius,16,15);
    for (const [side,z] of [[-1,-edge],[1,edge]]) {
      const tip=project(point(side*30,y,z));
      const color=state.progress===1 ? palette.path : palette.muted;
      stroke(ctx,tip,{x:tip.x-side*7,y:tip.y-3.5},color,1.3);
      stroke(ctx,tip,{x:tip.x-side*7,y:tip.y+3.5},color,1.3);
    }
    for (const [text,position,dx,dy] of [
      ['光源 S',source,21,-1],['狭缝 O',slit,24,-1],['八面镜 A',point(x+radius,y,0),9,-5],
      ['凹镜 B',point(mirrorVertex,y,0),-15,58],['平面镜 M',plane,17,-8],['望远镜 C',scope,26,-4]
    ]) {
      const p = project(position);
      words(ctx,text,p.x+dx,p.y+dy,palette.text,17,'left');
    }
  }

  function drawDetector(returned, offset) {
    const bounds = detector.getBoundingClientRect();
    if (!bounds.width) return;
    const height = 300 * bounds.height / bounds.width;
    const ctx = canvasFrame(detector, 300, height);
    if (!ctx) return;
    const y = height / 2;
    const lens = ctx.createRadialGradient(150, y, 3, 150, y, 155);
    lens.addColorStop(0, '#22343c');
    lens.addColorStop(1, '#0b1419');
    ctx.fillStyle = lens;
    ctx.fillRect(0, 0, 300, height);
    const spread = Math.min(height * .32, 29);
    ctx.setLineDash([3, 3]);
    stroke(ctx, {x:150,y:y-spread-3}, {x:150,y:y+spread+3}, palette.slot, 1.05);
    ctx.setLineDash([]);
    const inView = returned && Math.abs(offset) <= halfField;
    const x = inView ? 150 + 118 * Math.tan(offset) / Math.tan(halfField) : null;
    if (inView) beam(ctx, {x,y:y-spread}, {x,y:y+spread});
    detector.dataset.slit = inView ? String(x) : '';
  }

  function draw(state, observation) {
    snapshot = { state, observation };
    const returned = state.progress === 1;
    const measuring = state.step >= 2;
    const fullPhase = observation.revolutions * 2 * Math.PI;
    const physicalPhase = fullPhase * clamp((state.progress-launchAt)/(returnAt-launchAt),0,1);
    const phase = measuring ? faceAngle : physicalPhase;
    const offset = observation.angularOffset;
    pathStage.textContent = state.playing ? state.progress < launchAt ? 'S → O → 面 1'
      : state.progress < .46 ? '去程 · 面 1 → B' : state.progress < .54 ? '远端 · B → M → B'
        : state.progress < returnAt ? '回程 · B → A' : '八面镜反射回光' : returned ? '已回到近端' : '待发射';
    returnTitle.textContent = state.playing ? '往返途中' : returned ? '回到近端时' : '等待回光';
    angleLabel.textContent = measuring ? '首次重新对准时的转角' : '八面镜转过的角度';
    angleReading.textContent = returned ? 'Δθ = ' + optics.degrees(phase).toFixed(measuring ? 0 : 2) + '°' : '—';
    const receivingFace = numberFace(rayToFace(1,phase).face);
    returnDetail.textContent = !returned ? '与上图同视角' : measuring ? '面 2 到达面 3 原位' : '面 ' + receivingFace + ' 接到回光';
    lightState.textContent = !returned ? '等待回光' : Math.abs(offset) < .004 ? 'S 的像在基准刻线'
      : Math.abs(offset)>halfField ? '光偏离 C，看不到像' : offset < 0 ? 'S 的像偏左' : 'S 的像偏右';
    arrival.dataset.phase = String(phase);
    arrival.dataset.face = String(receivingFace);
    drawOverview(state, physicalPhase, fullPhase);
    compare(departure, 0, true, false);
    compare(arrival, phase, false, returned);
    drawDetector(returned, offset);
  }

  function redraw() {
    if (snapshot) draw(snapshot.state, snapshot.observation);
  }

  for (const canvas of [departure, arrival]) {
    canvas.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      drag = { pointer: event.pointerId, x: event.clientX, yaw: view.yaw };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (drag?.pointer !== event.pointerId) return;
      view.yaw = clamp(drag.yaw + (event.clientX - drag.x) * .008, -.70, .30);
      redraw();
    });
    canvas.addEventListener('lostpointercapture', () => { drag = null; });
    canvas.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      view.yaw = clamp(view.yaw + (event.key === 'ArrowRight' ? .09 : -.09), -.70, .30);
      redraw();
    });
  }
  byId('reset-camera').addEventListener('click', () => {
    view.yaw = initialYaw;
    redraw();
  });
  const resize = new ResizeObserver(redraw);
  [departure, arrival, detector].forEach(canvas => resize.observe(canvas));
  return { draw };
}

(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const kind = document.documentElement.dataset.kind;
  const fizeau = kind === 'fizeau';
  const apparatus = optics.experiments[kind];
  const scene = fizeau ? createFizeauScene() : createMichelsonScene();
  const slider = byId('speed');
  const title = byId('step-title');
  const instructions = byId('instructions');
  const primary = byId('main-action');
  const replay = byId('replay');
  const feedback = byId('feedback');
  const calculation = byId('calculation');
  const less = byId('less');
  const more = byId('more');
  const duration = 500;
  const decimals = fizeau ? 2 : 1;
  const fineAdjustment = fizeau ? .10 : 1;
  const steps = [
    ['看光怎样往返', fizeau ? '点击「发射一束光」，看光从齿轮出发，经远端反射镜回到近端。'
      : '点击「发射一束光」，看八面镜静止时，光怎样经面 3 进入望远镜 C。'],
    fizeau ? ['调速，找第一次最暗', '向右拖动转速滑块，每次调速都会播放往返。观察光斑，接近最暗时可用下方按钮微调。']
      : ['调速，让光源 S 的像重现', '观察面 3 转离后光落在哪里。调速让面 2 接替面 3，再看望远镜 C。'],
    fizeau ? ['用轮缘弧长求往返时间', '「回到近端时」图中的青线标出轮缘移过的距离。用半径和角速度求轮缘线速度，再用弧长除以线速度。']
      : ['用转角求往返时间', '读出「回到近端时」图中的转角。把角度化成弧度，再用转角除以角速度。'],
    ['用往返路程求光速', '光在这段时间内走了两段长度为 L 的路程。用往返路程除以往返时间。']
  ];
  const draw = () => scene.draw(state, observation);
  let state;
  let observation;
  let result;
  let frame;

  function status(message, ready = false) {
    feedback.textContent = message;
    feedback.toggleAttribute('data-ready', ready);
  }

  function updateControls() {
    const { step, playing, progress } = state;
    const returned = progress === 1;
    const ready = returned && observation.aligned;
    primary.disabled = false;
    replay.hidden = step > 1 || (step === 0 && !returned);
    replay.disabled = playing;
    if (step === 0) {
      primary.textContent = returned ? '开始调速' : playing ? '光束正在往返…' : '发射一束光';
      primary.disabled = playing;
      status(returned ? (fizeau ? '回光穿过原来的齿缝，观察端有亮斑。' : '静止时，面 3 把光反射进望远镜 C。') : '', returned);
    } else if (step === 1) {
      primary.textContent = '记录转速';
      primary.disabled = !ready;
      if (playing) status('光束正在往返。');
      else if (ready) status(fizeau ? '已到第一次最暗附近。点击「记录转速」。' : '面 2 已接替面 3，点击「记录转速」。', true);
      else if (fizeau) {
        status(observation.pitchTravel > .5 ? '已越过第一次最暗的位置，降低转速。' : '向右调速，找光斑第一次最暗的位置。');
      } else status(observation.pitchTravel > 1 ? '面 2 已转过目标位置，降低转速。' : '继续提高转速，等面 2 转到面 3 原位。');
    } else if (step === 2) {
      primary.textContent = '核对往返时间';
      status('');
    } else {
      primary.textContent = state.complete ? '再测一次' : '核对光速';
      status('');
    }
  }

  function row(label, value, formula = false) {
    const line = document.createElement('div');
    const name = document.createElement('dt');
    const reading = document.createElement('dd');
    name.textContent = label;
    if (formula) line.className = 'formula';
    if (typeof value === 'string') reading.textContent = value;
    else reading.append(value);
    line.append(name, reading);
    calculation.append(line);
  }

  function renderStep(focus = true) {
    const { step, complete, frequency } = state;
    title.textContent = complete ? '测量完成' : steps[step][0];
    instructions.textContent = complete ? '用记录的转速求出了空气中的光速。' : steps[step][1];
    byId('step-count').textContent = complete ? '已完成 4 步' : '第 ' + (step + 1) + ' 步 / 共 4 步';
    byId('progress').value = complete ? 4 : step;
    byId('speed-panel').hidden = step !== 1;
    calculation.hidden = step < 2;
    calculation.replaceChildren();
    if (step === 2) {
      if (fizeau) {
        row('轮缘弧长 s', (result.arc * 1000).toFixed(4) + ' mm');
        row('齿轮半径 R', (apparatus.radius * 100).toFixed(1) + ' cm');
      } else row('转角 Δθ', optics.degrees(result.turnAngle).toFixed(0) + '° = π/4 rad');
      row('记录的转速 f', frequency.toFixed(decimals) + ' 圈/s');
      row('角速度 ω = 2πf', result.angularSpeed.toFixed(2) + ' rad/s');
      row('往返时间', fizeau ? 'Δt = s / (Rω)' : 'Δt = Δθ / ω', true);
    } else if (step === 3) {
      row('往返时间 Δt', (result.time * 1e6).toFixed(2) + ' μs');
      row('往返路程 2L', fizeau ? (result.length / 1000).toFixed(2) + ' km'
        : result.length.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' m');
      if (complete) {
        const speed = document.createElement('strong');
        speed.id = 'measured-speed';
        speed.textContent = (result.speed / 1e8).toFixed(2) + ' × 10⁸ m/s';
        row('空气中的光速', speed, true);
      } else row('光速', 'v = 2L / Δt', true);
    }
    updateControls();
    draw();
    if (focus) {
      if (step === 1) slider.focus({ preventScroll: true });
      else if (complete) title.focus({ preventScroll: true });
      else primary.focus({ preventScroll: true });
    }
  }

  function play() {
    cancelAnimationFrame(frame);
    const fromPrimary = document.activeElement === primary;
    state.progress = 0;
    state.playing = true;
    updateControls();
    draw();
    const start = performance.now();
    function tick(timestamp) {
      state.progress = Math.max(0, Math.min(1, (timestamp - start) / duration));
      if (state.progress === 1) {
        state.playing = false;
        updateControls();
        if (fromPrimary && state.step === 0 && document.activeElement === document.body) {
          primary.focus({ preventScroll: true });
        }
      } else frame = requestAnimationFrame(tick);
      draw();
    }
    frame = requestAnimationFrame(tick);
  }

  function refreshFrequency() {
    const value = state.frequency.toFixed(decimals) + ' 圈/s';
    slider.value = Math.max(state.frequency, apparatus.min);
    slider.setAttribute('aria-valuetext', value);
    byId('frequency').textContent = value;
    less.disabled = state.frequency <= apparatus.min;
    more.disabled = state.frequency >= apparatus.max;
    observation = optics.observe(kind, state.frequency);
  }

  function setFrequency(frequency) {
    const next = Math.max(apparatus.min, Math.min(apparatus.max, Number(frequency.toFixed(decimals))));
    if (next === state.frequency) return;
    state.frequency = next;
    refreshFrequency();
    play();
  }

  function reset(focus) {
    cancelAnimationFrame(frame);
    state = { step: 0, frequency: 0, progress: 0, playing: false, complete: false };
    result = null;
    refreshFrequency();
    renderStep(focus);
  }

  primary.addEventListener('click', () => {
    if (state.step === 0 && state.progress === 0) play();
    else if (state.complete) reset(true);
    else if (state.step === 3) {
      state.complete = true;
      renderStep();
    } else {
      state.step++;
      if (state.step === 2) result = fizeau ? optics.fizeauFromArc(state.frequency) : optics.michelsonFromAngle(state.frequency);
      renderStep();
      if (!fizeau && state.step === 1) setFrequency(apparatus.initial);
    }
  });
  replay.addEventListener('click', play);
  byId('reset').addEventListener('click', () => reset(true));
  slider.min = apparatus.min;
  slider.max = apparatus.max;
  slider.step = apparatus.step;
  slider.addEventListener('input', () => setFrequency(+slider.value));
  const adjustmentLabel = fineAdjustment.toFixed(fizeau ? 2 : 0);
  less.textContent = '−' + adjustmentLabel;
  more.textContent = '+' + adjustmentLabel;
  less.setAttribute('aria-label', '转速降低 ' + adjustmentLabel + ' 圈每秒');
  more.setAttribute('aria-label', '转速提高 ' + adjustmentLabel + ' 圈每秒');
  less.addEventListener('click', () => setFrequency(state.frequency - fineAdjustment));
  more.addEventListener('click', () => setFrequency(state.frequency + fineAdjustment));
  const equipment = fizeau ? '轮齿 ' + apparatus.count + ' 个 · 半径 ' + (apparatus.radius * 100).toFixed(1) + ' cm'
    : '旋转镜 ' + apparatus.count + ' 个镜面';
  byId('setup').textContent = equipment + (fizeau ? ' · 单程距离 ' + (apparatus.distance / 1000).toFixed(2) + ' km'
    : ' · 两山距离 ' + apparatus.distance.toLocaleString('zh-CN',{minimumFractionDigits:2}) + ' m');
  if (!fizeau) {
    const shortcut = document.createElement('button');
    shortcut.type = 'button';
    shortcut.id = 'textbook-speed';
    shortcut.textContent = '教材转速 ' + apparatus.reference;
    shortcut.setAttribute('aria-label', '设为教材转速 ' + apparatus.reference + ' 圈每秒');
    shortcut.addEventListener('click', () => {
      if (state.frequency === apparatus.reference) play();
      else setFrequency(apparatus.reference);
    });
    byId('speed-panel').querySelector('.adjust p').replaceWith(shortcut);
  }
  title.tabIndex = -1;
  window.__CORE = optics;
  reset(false);
  new ResizeObserver(draw).observe(byId('scene'));
  document.fonts.ready.then(draw);
})();

</script>
</body>
</html>
