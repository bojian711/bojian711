:root{
  --bg:#ffffff; --panel:#f5f6f8; --fg:#23262b; --muted:#6b7078; --line:#dcdee3;
  --p1:#a3563c; --p2:#3a6ea5; --p3:#4f7a45; --p4:#6f5f8f; --btn:#eceff3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181c; --panel:#212329; --fg:#e6e6e6; --muted:#9aa0a8; --line:#3a3d45;
    --p1:#cf9179; --p2:#7fa8d4; --p3:#8fae7f; --p4:#a893c4; --btn:#2c2f37;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);border:none;
  font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.v{font-family:KaTeX_Math,Georgia,serif;font-style:italic}
.n{font-family:KaTeX_Main,Georgia,serif}
.sb{font-size:10.5px}
.wrap{width:100%;max-width:920px;margin:0 auto;padding:6px 6px 10px}
canvas{display:block;width:100%;height:400px}
.head{padding:2px 4px 6px;font-size:15px}
.panel{background:var(--panel);border-radius:10px;padding:9px 12px 11px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
/* 参数面板用等宽网格：每格一样宽，滑块长度自然一致，也不会出现某个控制器落单占满整行 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px;align-items:center}
.ctl{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.ctl .lb{white-space:nowrap}
.ctl output{font-family:KaTeX_Main,Georgia,serif;min-width:46px;text-align:right}
/* 滑块封顶：换行后落单的控制器不会把轨道拉满整行 */
input[type=range]{flex:1 1 60px;accent-color:var(--p2);min-width:44px;max-width:230px}
input[type=radio]{accent-color:var(--p2)}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:5px 13px;font-size:13px;cursor:pointer}
button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
.segs{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;font-size:12.5px;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.seg .tg{font-family:KaTeX_Main,Georgia,serif;color:var(--muted)}
.seg .st{font-size:12px;color:var(--muted)}
.readout{display:flex;flex-wrap:wrap;gap:3px 22px;margin-top:8px;padding-top:7px;
  border-top:1px solid var(--line);font-size:13px;line-height:1.7}
.rule{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:13px;line-height:1.75}
.hint{margin-top:6px;font-size:12.5px;color:var(--muted);min-height:1.7em;line-height:1.6}
.c1{color:var(--p1);font-weight:700}
.c2{color:var(--p2);font-weight:700}
.c3{color:var(--p3);font-weight:700}
.c4{color:var(--p4);font-weight:700}
</style>
</head>
<body>
<div class='wrap'>
  <div class='head'><span class='n'>传送带上的物体 · 情景与 <span class='v'>v</span>–<span class='v'>t</span> 图</span></div>
  <canvas id='sc'></canvas>
  <canvas id='cv'></canvas>
  <div class='panel'>
    <div class='grid'>
      <div class='ctl'><span class='lb c2'>带速 <span class='v'>v</span><span class='n sb'>带</span></span>
        <input id='sVb' type='range' min='-10' max='10' step='0.1' value='2'><output id='oVb'>2</output></div>
      <div class='ctl'><span class='lb c4'>带加速度 <span class='v'>a</span><span class='n sb'>带</span></span>
        <input id='sAb' type='range' min='-4' max='4' step='0.1' value='0'><output id='oAb'>0</output></div>
      <div class='ctl'><span class='lb'>质量 <span class='v'>m</span></span>
        <input id='sM' type='range' min='0.5' max='10' step='0.1' value='2'><output id='oM'>2</output></div>
      <div class='ctl'><span class='lb c1'>初速 <span class='v'>v</span><span class='n sb'>0</span></span>
        <input id='sV0' type='range' min='0' max='20' step='0.1' value='0'><output id='oV0'>0</output></div>
      <div class='ctl'><span class='lb'>带长 <span class='v'>L</span></span>
        <input id='sL' type='range' min='1' max='20' step='0.5' value='6'><output id='oL'>6</output></div>
      <div class='ctl'><span class='lb'>倾角 <span class='v'>θ</span></span>
        <input id='sTh' type='range' min='-30' max='30' step='1' value='0'><output id='oTh'>0</output></div>
      <div class='ctl'><span class='lb c3'>摩擦因数 <span class='v'>μ</span></span>
        <input id='sMu' type='range' min='0' max='1' step='0.01' value='0.2'><output id='oMu'>0.2</output></div>
      <div class='ctl'><span class='lb c1'>初始位置</span>
        <label class='chk'><input id='kLow' type='radio' name='pEnd' checked><span id='lLow'>最下方</span></label>
        <label class='chk'><input id='kHigh' type='radio' name='pEnd'><span id='lHigh'>最上方</span></label>
      </div>
      <div class='ctl'>
        <button id='bPlay' class='on'>开始</button><button id='bReset'>复位</button>
      </div>
    </div>
    <div class='row' style='margin-top:8px'>
      <label class='chk'><input id='kRel' type='checkbox'>显示相对速度 <span class='v'>v</span><span class='n sb'>相</span></label>
      <label class='chk'><input id='kMark' type='checkbox' checked>标注分段时刻</label>
      <label class='chk'><input id='kLoop' type='checkbox' checked>循环播放</label>
    </div>
    <div class='segs' id='segs'></div>
    <div class='readout'>
      <span>共速时刻 <span class='n' id='rSync'>—</span></span>
      <span>相对滑动路程 <span class='n' id='rSrel'>—</span></span>
      <span>摩擦生热 <span class='n' id='rQ'>—</span></span>
      <span>滑动摩擦力 <span class='n' id='rF'>—</span></span>
      <span>结果 <span class='n' id='rEnd'>—</span></span>
      <span>离开带面后 <span class='n' id='rFly'>—</span></span>
    </div>
    <div class='rule'>滑动段的加速度只由 <span class='v c3'>μ</span> 与 <span class='v'>θ</span> 决定（<span class='n'>±μg cosθ − g sinθ</span>），与 <span class='v'>m</span> 无关；质量只改变摩擦力与摩擦生热。物块可摆在最下方或最上方，<span class='v'>v</span><span class='n sb'>0</span> 是速率，方向沿带面指向带内。</div>
    <div class='hint' id='hint'>设定各项参数后，按「开始」按钮播放。</div>
  </div>
</div>
<script>
(function(){
'use strict';
var D=document;
function $(id){return D.getElementById(id);}
var cvs=$('cv'), scv=$('sc');
var CTXA=cvs.getContext('2d'), CTXB=scv.getContext('2d'), ctx=CTXA;

/* ===== 常量 ===== */
var LW=900, LH=400, G=10;
var SW=900, SH=250;
var PLOTX0=76, PLOTX1=846, PY0=44, PY1=306;
/* 情景图几何：滚筒半径、支腿长、胶带纹路间距 */
var SRD=20, SLEGL=26, SRIB=22;
var SHMIN=250, SHMAX=450;

/* ===== 状态 ===== */
var P={vb:2,ab:0,m:2,v0:0,mu:0.2,L:6,th:0,end:'low'};
var DEF={vb:2,ab:0,m:2,v0:0,mu:0.2,L:6,th:0,end:'low'};
var R=null, PR=null, PP=null, FI=null;
var TM=4, VLO=-1, VHI=3, VT=0.5, TT=0.5, BASEY=250, TSHOW=4;
var tCur=0, wait=0, running=false, last=0, started=false;
var SHOW_REL=false, SHOW_MARK=true, LOOP=true;
var HALO='#ffffff';
var OCC=[], CW=LW, CH=LH;

var sVb=$('sVb'), sAb=$('sAb'), sL=$('sL'), sTh=$('sTh'), sM=$('sM'), sV0=$('sV0'), sMu=$('sMu');
var oVb=$('oVb'), oAb=$('oAb'), oL=$('oL'), oTh=$('oTh'), oM=$('oM'), oV0=$('oV0'), oMu=$('oMu');
var rSync=$('rSync'), rSrel=$('rSrel'), rQ=$('rQ'), rF=$('rF'), rEnd=$('rEnd'), rFly=$('rFly');
var segsEl=$('segs'), hint=$('hint');
var bPlay=$('bPlay'), bReset=$('bReset');

/* ===== 小工具 ===== */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function num(v,d){
  if(!isFinite(v)) v=0;
  var s=(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
  if(s==='-0.00'||s==='0.00') s='0';
  return s.replace('-','\u2212');
}
function snum(v,d){
  if(Math.abs(v)<1e-9) return num(0,d);
  return (v>0?'+':'\u2212')+num(Math.abs(v),d);
}
function fontOf(isVar,size){return (isVar?'italic ':'')+size+'px '+(isVar?'KaTeX_Math':'KaTeX_Main')+',Georgia,serif';}
/* parts: 字符串=正体，{t,v}=变量斜体，{t,sup}=上标（KaTeX_Main 无 Unicode 上标字形，只能手动缩字号抬基线） */
function partsOf(ps){
  var out=[],i;
  for(i=0;i<ps.length;i++){
    if(typeof ps[i]==='string') out.push([ps[i],false,false]);
    else out.push([ps[i].t,!!ps[i].v,!!ps[i].sup]);
  }
  return out;
}
function fszof(p,size){return p[2]?Math.round(size*0.72*10)/10:size;}
function fyof(p,size,y){return p[2]?y-size*0.36:y;}
/* 画布文本预处理：·(U+00B7，KaTeX_Main 无此字形)→数学点 U+22C5；⁻¹/⁻² → 上标 part */
function ctext(s){
  var out=[],buf='',i,ch;
  for(i=0;i<s.length;i++){
    ch=s.charAt(i);
    if(ch==='·'){buf+='\u22C5'; continue;}
    if(ch==='⁻'&&i+1<s.length){
      if(buf){out.push(buf); buf='';}
      out.push({t:'\u2212'+s.charAt(i+1),sup:true}); i++; continue;
    }
    buf+=ch;
  }
  if(buf) out.push(buf);
  return out;
}
function rtWidth(ps,size){
  var p=partsOf(ps),i,w=0;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],fszof(p[i],size)); w+=ctx.measureText(p[i][0]).width;}
  return w;
}
function rtext(ps,x,y,size,color,align,base,halo){
  var p=partsOf(ps),i,w=0;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],fszof(p[i],size)); w+=ctx.measureText(p[i][0]).width;}
  var sx=align==='center'?x-w/2:(align==='right'?x-w:x), yy;
  ctx.textAlign='left'; ctx.textBaseline=base||'alphabetic'; ctx.fillStyle=color;
  for(i=0;i<p.length;i++){
    ctx.font=fontOf(p[i][1],fszof(p[i],size));
    yy=fyof(p[i],size,y);
    if(halo&&HALO){ctx.strokeStyle=HALO; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeText(p[i][0],sx,yy);}
    ctx.fillText(p[i][0],sx,yy);
    sx+=ctx.measureText(p[i][0]).width;
  }
  return w;
}
function rtextBox(ps,x,y,size,color,align,base){
  var p=partsOf(ps),i,w=0;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],size); w+=ctx.measureText(p[i][0]).width;}
  var sx=align==='center'?x-w/2:(align==='right'?x-w:x);
  var h=size*1.08, top;
  if(base==='top') top=y-1.5;
  else if(base==='bottom') top=y-h+1;
  else if(base==='middle') top=y-h/2;
  else top=y-size*0.8;
  ctx.fillStyle=HALO; ctx.fillRect(sx-2.5,top,w+5,h);
  ctx.textAlign='left'; ctx.textBaseline=base||'alphabetic'; ctx.fillStyle=color;
  var cx=sx;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],size); ctx.fillText(p[i][0],cx,y); cx+=ctx.measureText(p[i][0]).width;}
  return w;
}
function boxOf(ps,x,y,size,align,base){
  var w=rtWidth(ps,size), h=size*1.08;
  var sx=align==='center'?x-w/2:(align==='right'?x-w:x);
  var top;
  if(base==='top') top=y-1.5;
  else if(base==='bottom') top=y-h+1;
  else if(base==='middle') top=y-h/2;
  else top=y-size*0.8;
  return [sx-3,top-1,w+6,h+2];
}
function freeRect(b){
  var i,r;
  for(i=0;i<OCC.length;i++){
    r=OCC[i];
    if(b[0]<r[0]+r[2]&&b[0]+b[2]>r[0]&&b[1]<r[1]+r[3]&&b[1]+b[3]>r[1]) return false;
  }
  return true;
}
/* 依次尝试候选位置，第一个不撞已占区域的才画 */
function tryLabel(ps,cands,size,color){
  var i,c,b;
  for(i=0;i<cands.length;i++){
    c=cands[i];
    b=boxOf(ps,c[0],c[1],size,c[2]||'center',c[3]||'middle');
    if(b[0]<2||b[0]+b[2]>CW-2||b[1]<2||b[1]+b[3]>CH-2) continue;
    if(!freeRect(b)) continue;
    rtextBox(ps,c[0],c[1],size,color,c[2]||'center',c[3]||'middle');
    OCC.push(b);
    return true;
  }
  return false;
}
/* 情景图标签：先按候选位避让，全撞则取重叠面积最小的位置，绝不丢标签 */
function ovArea(a,b){
  var ox=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]);
  var oy=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);
  return (ox>0&&oy>0)?ox*oy:0;
}
function placeS(ps,al,x0,y0,size,color,dys){
  var c=[],i,j,b,ov,bs,best=null,xx=clampTx(x0,ps,size,al);
  for(i=0;i<dys.length;i++) c.push([xx,y0+dys[i],al,'middle']);
  if(tryLabel(ps,c,size,color)) return true;
  for(i=0;i<dys.length;i++){
    b=boxOf(ps,xx,y0+dys[i],size,al,'middle');
    if(b[0]<2||b[0]+b[2]>CW-2||b[1]<2||b[1]+b[3]>CH-2) continue;
    ov=0; for(j=0;j<OCC.length;j++) ov+=ovArea(b,OCC[j]);
    if(best===null||ov<bs){bs=ov; best=[xx,y0+dys[i]];}
  }
  if(best===null) return false;
  rtextBox(ps,best[0],best[1],size,color,al,'middle');
  OCC.push(boxOf(ps,best[0],best[1],size,al,'middle'));
  return true;
}
/* 单个位置试放：撞了或出界就不画，由调用方换位置（抛体标注的位置比物块标签更挤） */
function placeAt(ps,al,x,y,size,color){
  var xx=clampTx(x,ps,size,al);
  var b=boxOf(ps,xx,y,size,al,'middle');
  if(b[0]<2||b[0]+b[2]>CW-2||b[1]<2||b[1]+b[3]>CH-2) return false;
  if(!freeRect(b)) return false;
  rtextBox(ps,xx,y,size,color,al,'middle');
  OCC.push(b);
  return true;
}
function placeAny(ps,al,x,y,size,color,cands){
  var i;
  for(i=0;i<cands.length;i++) if(placeAt(ps,al,x+cands[i][0],y+cands[i][1],size,color)) return true;
  return false;
}
function cssVar(n,fb){
  var v='';
  try{v=getComputedStyle(D.documentElement).getPropertyValue(n)||'';}catch(e){v='';}
  v=(v||'').trim();
  return v||fb;
}
function lumOf(c){
  var m=/^#?([0-9a-f]{6})$/i.exec((c||'').trim());
  if(!m) return 1;
  var n=parseInt(m[1],16);
  return ((n>>16&255)*0.299+(n>>8&255)*0.587+(n&255)*0.114)/255;
}
function theme(){
  var bg=cssVar('--bg','#ffffff'), dk=lumOf(bg)<0.42;
  return dk?{
    grid:'rgba(255,255,255,0.07)', axis:'#c8ccd2', tick:'#9aa0a8', bg:bg,
    p1:'#cf9179', p2:'#7fa8d4', p3:'#8fae7f', p4:'#a893c4',
    dev:'#6b7480', devf:'#2b2e35', devs:'#8a939f',
    fg:'#e6e6e6', muted:'#9aa0a8', dim:'rgba(230,230,230,0.30)'
  }:{
    grid:'rgba(20,24,32,0.07)', axis:'#3a3f47', tick:'#6b7078', bg:bg,
    p1:'#a3563c', p2:'#3a6ea5', p3:'#4f7a45', p4:'#6f5f8f',
    dev:'#98a2ae', devf:'#e7eaef', devs:'#6f7a87',
    fg:'#23262b', muted:'#6b7078', dim:'rgba(35,38,43,0.28)'
  };
}

/* ===== 端点命名：x 增大方向在 θ ≥ 0 时朝高端，θ < 0 时朝低端 =====
   物块可从最低端或最高端放上，初速一律沿带面指向带内。 */
function upIsPlus(){return P.th>=-0.5;}
function xOfEnd(p){
  var hip=p.th>=-0.5;
  return ((p.end==='high')===hip)?p.L:0;
}
function vInitOf(p){
  var s=p.th>=-0.5?1:-1;
  return ((p.end==='high')?-s:s)*p.v0;
}
/* atL：是否 x = L 那一端 */
function endName(atL){
  if(Math.abs(P.th)<0.5) return atL?'右端':'左端';
  return (atL===upIsPlus())?'上端':'下端';
}
function exitEndName(){return endName(R.exitType==='out');}
function startEndName(){return endName(P.end==='high'?upIsPlus():!upIsPlus());}

/* ===== 物理内核：分段匀变速 + 事件（共速 / 离开端点） ===== */
function rootPos(A,B,C){
  var r=[];
  if(Math.abs(A)<1e-12){
    if(Math.abs(B)<1e-12) return null;
    var hh=-C/B;
    return hh>1e-9?hh:null;
  }
  var d=B*B-4*A*C;
  if(d<0) return null;
  var sd=Math.sqrt(d), h1=(-B-sd)/(2*A), h2=(-B+sd)/(2*A);
  if(h1>1e-9) r.push(h1);
  if(h2>1e-9) r.push(h2);
  if(!r.length) return null;
  return Math.min.apply(null,r);
}
function solve(p){
  var th=p.th*Math.PI/180, s=Math.sin(th), c=Math.cos(th);
  var gs=G*s, gc=G*c, mugc=p.mu*gc;
  var aUp=-gs+mugc, aDn=-gs-mugc;
  function vbAt(t){return p.vb+p.ab*t;}
  function accOf(u){
    if(Math.abs(u)<1e-9){
      var need=p.ab+gs;
      if(Math.abs(need)<=mugc+1e-9) return {a:p.ab,stick:true};
      return {a:need>0?aUp:aDn,stick:false};
    }
    return u>0?{a:aDn,stick:false}:{a:aUp,stick:false};
  }
  var segs=[], t=0, x=xOfEnd(p), v=vInitOf(p), guard=0;
  var srel=0, exitType=null, tEnd=0, vEnd=v, xEnd=0, tSync=null;
  while(guard++<400){
    var u=v-vbAt(t), A=accOf(u), a=A.a;
    if(Math.abs(a)<1e-12&&Math.abs(v)<1e-12){
      exitType='stop'; tEnd=t; vEnd=v; xEnd=x;
      segs.push({t0:t,t1:t,x0:x,v0:v,a:a,stick:A.stick,u0:u,srel:0});
      break;
    }
    var hu=null, du=a-p.ab;
    if(Math.abs(du)>1e-12){var hh=-u/du; if(hh>1e-9) hu=hh;}
    /* 到 x = L 端：起点就在该端且速度/加速度朝外时，放上即离开 */
    var hL;
    if(x>=p.L-1e-12&&(v>0||(Math.abs(v)<1e-12&&a>0))) hL=0;
    else hL=rootPos(0.5*a,v,x-p.L);
    var hLow;
    if(x<=1e-12&&(v<0||(Math.abs(v)<1e-12&&a<0))) hLow=0;
    else hLow=rootPos(0.5*a,v,x);
    var cand=[];
    if(hu!==null) cand.push({h:hu,k:'u'});
    if(hL!==null) cand.push({h:hL,k:'L'});
    if(hLow!==null) cand.push({h:hLow,k:'lo'});
    var h, kind;
    if(cand.length){
      cand.sort(function(m,n){return m.h-n.h;});
      h=cand[0].h; kind=cand[0].k;
    }else{h=60-t; kind='cap';}
    if(t+h>60){h=60-t; kind='cap';}
    var x1=x+v*h+0.5*a*h*h, v1=v+a*h, sr=Math.abs(u*h+0.5*du*h*h);
    srel+=sr;
    segs.push({t0:t,t1:t+h,x0:x,v0:v,a:a,stick:A.stick,u0:u,srel:sr});
    t+=h; x=x1; v=v1;
    if(kind==='u'){ if(tSync===null) tSync=t; }
    else if(kind==='L'){ exitType='out'; tEnd=t; vEnd=v; xEnd=x; break; }
    else if(kind==='lo'){ exitType='back'; tEnd=t; vEnd=v; xEnd=x; break; }
    else { exitType='cap'; tEnd=t; vEnd=v; xEnd=x; break; }
  }
  if(exitType===null){exitType='cap'; tEnd=t; vEnd=v; xEnd=x;}
  function stateAt(tt){
    var i,sg,hh;
    if(tt<=0) return {v:vInitOf(p),x:xOfEnd(p),vb:p.vb,a:segs.length?segs[0].a:0};
    for(i=0;i<segs.length;i++){
      sg=segs[i];
      if(tt<=sg.t1+1e-12||i===segs.length-1){
        hh=clamp(tt-sg.t0,0,sg.t1-sg.t0);
        return {v:sg.v0+sg.a*hh, x:sg.x0+sg.v0*hh+0.5*sg.a*hh*hh, vb:vbAt(sg.t0+hh), a:sg.a};
      }
    }
    return {v:vEnd,x:xEnd,vb:vbAt(tEnd),a:0};
  }
  var vi=vInitOf(p);
  var lo=Math.min(0,vi,p.vb,vbAt(tEnd)), hi=Math.max(0,vi,p.vb,vbAt(tEnd));
  for(var i=0;i<segs.length;i++){
    lo=Math.min(lo,segs[i].v0,segs[i].v0+segs[i].a*(segs[i].t1-segs[i].t0));
    hi=Math.max(hi,segs[i].v0,segs[i].v0+segs[i].a*(segs[i].t1-segs[i].t0));
  }
  return {
    segs:segs, tEnd:tEnd, vEnd:vEnd, xEnd:xEnd, exitType:exitType, tSync:tSync,
    srel:srel, Q:mugc*p.m*srel, f:mugc*p.m, gs:gs, mugc:mugc, aUp:aUp, aDn:aDn,
    canStick:Math.abs(p.ab+gs)<=mugc+1e-9,
    stickFromStart:segs.length>0&&segs[0].stick&&Math.abs(segs[0].u0)<1e-9,
    stateAt:stateAt, vbAt:vbAt, vRange:[lo,hi]
  };
}

/* ===== 量程（只在跨档时跳变，不随参数连续缩放） ===== */
function niceStep(x){
  x=Math.max(Math.abs(x),1e-9);
  var e=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)), m=x/e;
  var mm=m<=1?1:(m<=2?2:(m<=2.5?2.5:(m<=5?5:10)));
  return mm*e;
}
function fitScale(){
  /* 播完带上这一段还不够，抛体也要演完才有得看；飞行超过 2.5 s 的按出画面处理 */
  var tail=FI?Math.min(FI.tm,2.5)+0.45:0;
  TSHOW=(R.exitType==='stop'?Math.max(R.tEnd,3):Math.max(R.tEnd,1.2))+tail;
  var traw=Math.max(TSHOW,0.8);
  TT=niceStep(traw/6);
  TM=Math.ceil(traw/TT-1e-9)*TT;
  var lo=R.vRange[0], hi=R.vRange[1], span=Math.max(hi-lo,1);
  VT=niceStep(span*1.24/5);
  VLO=Math.floor((lo-span*0.12)/VT-1e-9)*VT;
  VHI=Math.ceil((hi+span*0.12)/VT+1e-9)*VT;
  if(VLO>-1e-9) VLO-=VT;
  if(VHI<1e-9) VHI+=VT;
  BASEY=PY1-(0-VLO)/(VHI-VLO)*(PY1-PY0);
}
function X(t){return PLOTX0+t/TM*(PLOTX1-PLOTX0);}
function Y(v){return clamp(PY1-(v-VLO)/(VHI-VLO)*(PY1-PY0),PY0-24,PY1+24);}

/* ===== 画布尺寸 ===== */
function resize(){
  var r=cvs.getBoundingClientRect(), w=Math.max(320,r.width||860);
  var dpr=window.devicePixelRatio||1, hA=Math.round(LH*w/LW), hB=Math.round(SH*w/SW);
  cvs.style.height=hA+'px'; scv.style.height=hB+'px';
  cvs.width=Math.round(w*dpr); cvs.height=Math.round(hA*dpr);
  scv.width=Math.round(w*dpr); scv.height=Math.round(hB*dpr);
}

/* ===== 图元 ===== */
function dash(a){ctx.setLineDash(a||[]);}
function line(x1,y1,x2,y2,color,w){
  ctx.strokeStyle=color; ctx.lineWidth=w||1; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function arrowHead(x,y,dir,color,size){
  var s=size||5;
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x-dir*s*0.2,y-s*0.62); ctx.lineTo(x-dir*s*0.2,y+s*0.62);
  ctx.closePath(); ctx.fill();
}
/* 任意方向的箭头（抛体速度矢量用，方向随时间转） */
function arrowSeg(x1,y1,x2,y2,color,w){
  var a=Math.atan2(y2-y1,x2-x1), s=6.5;
  line(x1,y1,x2,y2,color,w||2);
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-s*Math.cos(a-0.42),y2-s*Math.sin(a-0.42));
  ctx.lineTo(x2-s*Math.cos(a+0.42),y2-s*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
}
function plot(fn,t0,t1,color,w,dashes,alpha){
  var a=Math.max(t0,0), b=Math.min(t1,TSHOW);
  if(!(b>a)) return;
  var n=Math.max(2,Math.ceil((X(b)-X(a))/2)), i, t, vv;
  ctx.save();
  ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.lineCap='round';
  dash(dashes||[]);
  ctx.beginPath();
  for(i=0;i<=n;i++){
    t=a+(b-a)*i/n; vv=fn(t);
    if(!isFinite(vv)) continue;
    if(i===0) ctx.moveTo(X(t),Y(vv)); else ctx.lineTo(X(t),Y(vv));
  }
  ctx.stroke(); ctx.restore(); dash();
}

/* ===== 情景图：传送带侧视（与 v–t 图共用时间轴） ===== */
function sBeltDisp(t){return P.vb*t+0.5*P.ab*t*t;}
/* 带面长度只由 L 决定：改倾角时视觉长度必须不变（2026-10-25）。
   L=1 → 120 px，L=20 → 500 px，单调饱和，精确长度看画面上的标尺。
   倾角变大时纵向尺寸由画布高度吸收，所以返回 h 让画布跟着长高。 */
function sFit(){
  var th=P.th*Math.PI/180, sa=Math.abs(Math.sin(th)), ca=Math.cos(th), sn=Math.sin(th);
  var Ls=600*P.L/(P.L+4);
  var W=Ls+2*SRD+24;
  var h=clamp(W*sa+158*ca+24,SHMIN,SHMAX);
  /* 旋转后的包围盒决定居中偏移；地面固定在低侧机脚下方，随倾角一起抬高/降低 */
  var cs=[[-SRD-12,-66],[Ls+SRD+12,-66],[-SRD-12,92],[Ls+SRD+12,92]],i,q;
  var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(i=0;i<4;i++){
    q=[cs[i][0]*ca+cs[i][1]*sn,-cs[i][0]*sn+cs[i][1]*ca];
    if(q[0]<mnx)mnx=q[0]; if(q[0]>mxx)mxx=q[0];
    if(q[1]<mny)mny=q[1]; if(q[1]>mxy)mxy=q[1];
  }
  var OX0=(SW-(mxx-mnx))/2-mnx, OY0=(h-(mxy-mny))/2-mny;
  /* 地面取在低侧机脚下方：θ>0 时低端在 x=0 侧，θ<0 时低端在 x=L 侧 */
  var lowX=sn>0?-(SRD+4):(Ls+SRD+4);
  var gy=66*ca-lowX*sn+16;
  return {s:Ls/P.L, Ls:Ls, th:th, h:h, OX0:OX0, OY0:OY0, gy:gy};
}
/* 离开带面后的抛体：起点是离开端点，落到地面为止；飞出画面就截断（画面外画不出来） */
function flyCalc(F){
  if(!R||(R.exitType!=='out'&&R.exitType!=='back')) return null;
  var sn=Math.sin(F.th), ca=Math.cos(F.th), s0=F.s;
  var xe=clamp(R.xEnd*s0,0,F.Ls);
  var wx0=F.OX0+xe*ca, wy0=F.OY0-xe*sn;
  var gpx=G*s0, vx=R.vEnd*s0*ca, vy=-R.vEnd*s0*sn;
  var Hpx=Math.max(F.gy+xe*sn,6);
  var tf=(-vy+Math.sqrt(Math.max(vy*vy+2*gpx*Hpx,0)))/gpx;
  if(!isFinite(tf)||tf<0) tf=0;
  var tb=tf;
  if(vx>1e-9) tb=Math.min(tb,(SW-14-wx0)/vx);
  else if(vx<-1e-9) tb=Math.min(tb,(14-wx0)/vx);
  if(!isFinite(tb)||tb<0) tb=0;
  var cut=tb<tf-1e-6, tm=Math.min(tb,tf);
  var kind;
  if(Math.abs(P.th)<0.5) kind=Math.abs(R.vEnd)>0.05?'平抛':'自由落体';
  else kind=(R.vEnd*sn>0.05)?'斜上抛':'斜下抛';
  return {x0:wx0, y0:wy0, vx:vx, vy:vy, g:gpx, s0:s0, tf:tf, tb:tb, tm:tm, cut:cut,
    kind:kind, hm:Hpx/s0, dxm:vx*tf/s0, land:{x:wx0+vx*tf, y:F.OY0+F.gy}};
}
/* 摩擦方向：滑动时逆相对运动；共速时按 f = m(a带 + g sinθ) 判定，为 0 则不画 */
function fricDir(st){
  var u=st.v-st.vb, gs=G*Math.sin(P.th*Math.PI/180), need;
  if(Math.abs(u)>1e-6){
    if(R.f<1e-9) return 0;
    return u>0?-1:1;
  }
  need=P.ab+gs;
  if(Math.abs(need)<1e-6) return 0;
  return need>0?1:-1;
}
function clampTx(x,ps,size,al){
  var w=rtWidth(ps,size), lo, hi;
  if(al==='right'){lo=10+w; hi=SW-10;}
  else if(al==='left'){lo=10; hi=SW-10-w;}
  else {lo=10+w/2; hi=SW-10-w/2;}
  return clamp(x,lo,hi);
}
/* 情景画布的高度随倾角变（纵向吸收旋转后的包围盒），宽度不变 */
function fitScene(){
  var r=scv.getBoundingClientRect(), w=Math.max(320,r.width||860);
  var dpr=window.devicePixelRatio||1, h=Math.round(SH*w/SW);
  if(!(Math.abs(parseFloat(scv.style.height)-h)<0.5)){
    scv.style.height=h+'px';
    scv.width=Math.round(w*dpr); scv.height=Math.round(h*dpr);
  }
}
function drawScene(T){
  var F=sFit(); SH=F.h; fitScene();
  ctx=CTXB; HALO=T.bg; OCC=[]; CW=SW; CH=SH;
  ctx.save();
  ctx.setTransform(scv.width/SW,0,0,scv.height/SH,0,0);
  ctx.clearRect(0,0,SW,SH);
  if(R){
    var s0=F.s, Ls=F.Ls, th=F.th;
    var ca=Math.cos(th), sn=Math.sin(th);
    var t=clamp(tCur,0,TSHOW), st=R.stateAt(t);
    var OX0=F.OX0, OY0=F.OY0, q, i, j;
    var yB=2*SRD+SLEGL, yR=yB+16, yR2=yB+16;
    /* 地面：始终水平，不随带倾斜；物体离开带面后就落到这里 */
    var yG=OY0+F.gy;
    line(8,yG,SW-8,yG,T.devs,1.4);
    for(j=12;j<SW-6;j+=22) line(j,yG+1,j-6,yG+8,T.devs,1);
    OCC.push([8,yG-2,SW-16,5]);
    ctx.save();
    ctx.translate(OX0,OY0); ctx.rotate(-th);
    /* 胶带：上工作段 + 两端包绕 + 下回程段，闭合成环 */
    ctx.strokeStyle=T.dev; ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(Ls,0);
    ctx.arc(Ls,SRD,SRD,-Math.PI/2,Math.PI/2);
    ctx.lineTo(0,2*SRD);
    ctx.arc(0,SRD,SRD,Math.PI/2,3*Math.PI/2);
    ctx.closePath(); ctx.stroke();
    /* 滚筒与辐条：转角 = 带面位移 / 半径，转向与带面一致 */
    var ang=sBeltDisp(t)*s0/SRD;
    for(j=0;j<2;j++){
      var cx0=j?Ls:0, aa;
      ring(cx0,SRD,SRD,T.devf,T.devs,1.6);
      for(i=0;i<3;i++){
        aa=ang+i*2.0944;
        line(cx0,SRD,cx0+SRD*0.74*Math.sin(aa),SRD-SRD*0.74*Math.cos(aa),T.devs,1.5);
      }
      dot(cx0,SRD,2.2,T.devs);
    }
    /* 胶带横纹：随带平移，直接给出带的速度方向与快慢 */
    var ph=((sBeltDisp(t)*s0)%SRIB+SRIB)%SRIB, xr;
    for(i=-1;i<=Math.ceil(Ls/SRIB)+1;i++){
      xr=i*SRIB+ph;
      if(xr<-0.5||xr>Ls+0.5) continue;
      line(xr,0.5,xr,5,T.devs,1.7);
    }
    /* 机架：立柱走在胶带环外侧，不与回程段相交 */
    for(j=0;j<2;j++){
      var sg2=j?1:-1, cx1=j?Ls:0, px0=cx1+sg2*(SRD+4);
      line(cx1+sg2*SRD,SRD,px0,SRD,T.dev,2.6);
      line(px0,SRD,px0,yB,T.dev,3.2);
      line(px0-8,yB,px0+8,yB,T.dev,3);
    }
    /* 带长标尺：跨档缩放时读数仍以这里为准 */
    line(0,yR,Ls,yR,T.muted,1);
    line(0,yR-4,0,yR+4,T.muted,1);
    line(Ls,yR-4,Ls,yR+4,T.muted,1);
    arrowHead(0,yR,-1,T.muted,4.6);
    arrowHead(Ls,yR,1,T.muted,4.6);
    /* 物块与三个矢量 */
    /* 矢量长度按速度真实比例：比例系数随尺度走，上限放宽，避免大带长时快慢箭头一样长 */
    var BW=clamp(0.34*s0,15,44), BH=BW*0.66, KV=clamp(0.24*s0,3.5,26), LVMAX=130;
    var onBelt=(R.exitType==='stop')||(t<=R.tEnd+1e-9);
    var xo=clamp(st.x*s0,BW/2,Math.max(BW/2,Ls-BW/2)), LB=[];
    if(onBelt){
      ctx.globalAlpha=0.2; ctx.fillStyle=T.p1; ctx.fillRect(xo-BW/2,-BH,BW,BH); ctx.globalAlpha=1;
      ctx.strokeStyle=T.p1; ctx.lineWidth=1.7; ctx.strokeRect(xo-BW/2,-BH,BW,BH);
      var dv=st.v<0?-1:1, lv=clamp(Math.abs(st.v)*KV,0,LVMAX);
      if(Math.abs(st.v)>0.02){
        line(xo,-BH-9,xo+dv*lv,-BH-9,T.p1,2.5);
        arrowHead(xo+dv*lv,-BH-9,dv,T.p1,6.5);
      }
      LB.push([xo+dv*(BW/2+lv+7),-BH-9,
        [{t:'v',v:true},{t:' = ',v:false},{t:num(st.v,2),v:false}],T.p1,dv>0?'left':'right']);
      var vb=st.vb, db=vb<0?-1:1, lb=clamp(Math.abs(vb)*KV,0,LVMAX);
      if(Math.abs(vb)>0.02){
        line(xo,-BH-27,xo+db*lb,-BH-27,T.p2,2.2);
        arrowHead(xo+db*lb,-BH-27,db,T.p2,6);
      }
      LB.push([xo+db*(BW/2+lb+7),-BH-27,
        [{t:'v',v:true},{t:'带',v:false},{t:' = ',v:false},{t:num(vb,2),v:false}],T.p2,db>0?'left':'right']);
      var fd=fricDir(st);
      if(fd!==0){
        line(xo,9,xo+fd*22,9,T.p4,2.2);
        arrowHead(xo+fd*22,9,fd,T.p4,5.5);
        LB.push([xo+fd*27,9,[{t:'f',v:true}],T.p4,fd>0?'left':'right']);
      }
    }else if(FI){
      /* 抛体：先在世界坐标算轨迹再换回带面坐标系画，物块保持离开时的姿态 */
      var tau=clamp(t-R.tEnd,0,FI.tm);
      var f2l=function(wx,wy){var dx=wx-OX0,dy=wy-OY0;return [dx*ca-dy*sn,dx*sn+dy*ca];};
      var n=Math.max(2,Math.ceil(FI.tm*12)), k, tk, pt;
      ctx.strokeStyle=T.p1; ctx.lineWidth=1.7; ctx.globalAlpha=0.9;
      dash([5,4]); ctx.beginPath();
      for(k=0;k<=n;k++){
        tk=tau*k/n;
        pt=f2l(FI.x0+FI.vx*tk,FI.y0+FI.vy*tk+0.5*FI.g*tk*tk);
        if(k===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]);
      }
      ctx.stroke(); dash(); ctx.globalAlpha=1;
      var wxf=FI.x0+FI.vx*tau, wyf=FI.y0+FI.vy*tau+0.5*FI.g*tau*tau;
      pt=f2l(wxf,wyf);
      if(tau>=FI.tm-1e-9&&!FI.cut){
        /* 落地后按水平姿态摆正：倾斜的方块贴在地面上像插进地里 */
        ctx.save(); ctx.translate(pt[0],pt[1]); ctx.rotate(th);
        ctx.globalAlpha=0.2; ctx.fillStyle=T.p1; ctx.fillRect(-BW/2,-BH,BW,BH); ctx.globalAlpha=1;
        ctx.strokeStyle=T.p1; ctx.lineWidth=1.7; ctx.strokeRect(-BW/2,-BH,BW,BH);
        ctx.restore();
      }else{
        ctx.globalAlpha=0.2; ctx.fillStyle=T.p1; ctx.fillRect(pt[0]-BW/2,pt[1]-BH,BW,BH); ctx.globalAlpha=1;
        ctx.strokeStyle=T.p1; ctx.lineWidth=1.7; ctx.strokeRect(pt[0]-BW/2,pt[1]-BH,BW,BH);
      }
      /* 速度矢量：只画方向，数字已经在 v–t 图上看过了，这里再标会把画面挤满 */
      var vxm=FI.vx, vym=FI.vy+FI.g*tau, vm=Math.sqrt(vxm*vxm+vym*vym);
      if(vm>1e-6&&tau<FI.tm-1e-9){   /* 落地即停，不再画速度矢量 */
        var ln=clamp(vm*0.045,15,62), p2=f2l(wxf+vxm/vm*ln,wyf+vym/vm*ln);
        arrowSeg(pt[0],pt[1]-BH/2,p2[0],p2[1]-BH/2,T.p1,2.2);
      }
    }
    ctx.restore();
    /* 两个滚筒登记为占位：位移很小时 x/h 读数会正好落在滚筒上 */
    for(i=0;i<2;i++){
      var cxr=i?Ls:0;
      var sxr=OX0+cxr*ca+SRD*sn, syr=OY0-cxr*sn+SRD*ca;
      OCC.push([sxr-SRD-1,syr-SRD-1,2*SRD+2,2*SRD+2]);
    }
    /* 标签一律水平绘制，位置由旋转换算，避免跟着倾角歪 */
    var DYV=[0,-15,-30,15,-45,30], DYS=[0,16,-16,32,-32];
    for(i=0;i<LB.length;i++){
      q=[OX0+LB[i][0]*ca+LB[i][1]*sn,OY0-LB[i][0]*sn+LB[i][1]*ca];
      placeS(LB[i][2],LB[i][4],q[0],q[1],12.5,LB[i][3],DYV);
    }
    /* 端名随倾角走：θ>0 时 x=0 是下端，θ<0 时反过来；水平带只说左右 */
    var n0=endName(false), nL=endName(true), atL0=(xOfEnd(P)===P.L);
    q=[OX0-(SRD+22)*ca+62*sn,OY0+(SRD+22)*sn+62*ca];
    placeS([{t:atL0?n0:n0+'（放上）',v:false}],'center',q[0],q[1],12.5,T.muted,DYS);
    q=[OX0+(Ls+SRD+22)*ca+62*sn,OY0-(Ls+SRD+22)*sn+62*ca];
    placeS([{t:atL0?nL+'（放上）':nL,v:false}],'center',q[0],q[1],12.5,T.muted,DYS);
    q=[OX0+Ls/2*ca+yR2*sn,OY0-Ls/2*sn+yR2*ca];
    placeS([{t:'L',v:true},{t:' = '+num(P.L,1)+' m',v:false}],'center',q[0],q[1],12.5,T.muted,[0,16,-16]);
    /* 倾角：x=L 端外侧画水平参考线与夹角弧 */
    if(Math.abs(P.th)>0.5){
      q=[OX0+Ls*ca,OY0-Ls*sn];
      dash([4,4]); line(q[0],q[1],q[0]+66,q[1],T.muted,1); dash();
      ctx.strokeStyle=T.muted; ctx.lineWidth=1.2; ctx.beginPath();
      ctx.arc(q[0],q[1],30,Math.min(0,-th),Math.max(0,-th)); ctx.stroke();
      var tp2=[{t:'θ',v:true},{t:' = '+num(P.th,0)+'°',v:false}];
      placeS(tp2,'left',q[0]+28,q[1]-30,12.5,T.muted,[0,-14,14,-28,28]);
    }
    /* 抛体的落差与水平位移：落定之后再标，飞行途中标会跟着物块乱跑 */
    if(FI&&!onBelt&&t>=R.tEnd+FI.tm-1e-9){
      var lx=FI.land.x;
      if(FI.cut){
        var ex=FI.x0+FI.vx*FI.tb, ey=FI.y0+FI.vy*FI.tb+0.5*FI.g*FI.tb*FI.tb;
        placeS([{t:'飞出画面',v:false}],'center',ex,ey-16,12.5,T.muted,[0,-18,18,-34]);
      }else{
        /* 分位移画成直角：水平位移在抛出点高度上，下落高度在落点处，直角落在落点正上方 */
        dash([4,4]);
        line(FI.x0,FI.y0,lx,FI.y0,T.muted,1);
        line(lx,FI.y0,lx,Math.max(FI.y0+6,yG-BH-5),T.muted,1);   /* 到物块顶部为止，别从物块里穿过去 */
        dash();
        var xSide=lx>=FI.x0?1:-1, al=xSide>0?'left':'right';
        /* 水平位移为 0（竖直下落）时不标 x，一条零长度的尺寸线没有信息量 */
        if(Math.abs(FI.dxm)>0.02)
          /* 先往侧面挪（贴着水平尺寸线），实在不行再上下挪，免得读数飞到带面上去 */
          placeAny([{t:'x',v:true},{t:' = '+num(FI.dxm,2)+' m',v:false}],
            'center',(FI.x0+lx)/2,FI.y0-15,12.5,T.p1,
            [[0,0],[xSide*44,0],[xSide*88,0],[0,-17],[xSide*44,-17],
             [xSide*88,-17],[0,17],[0,-34],[xSide*44,17]]);
        placeAny([{t:'h',v:true},{t:' = '+num(FI.hm,2)+' m',v:false}],
          al,lx+xSide*9,(FI.y0+yG)/2,12.5,T.muted,
          [[0,0],[0,-19],[0,19],[0,-38],[0,38],[-xSide*18,0]]);
      }
    }
  }
  ctx.restore();
  ctx=CTXA; CW=LW; CH=LH;
}

function draw(){
  var T=theme();
  HALO=T.bg;
  ctx=CTXA;
  OCC=[];
  ctx.save();
  ctx.setTransform(cvs.width/LW,0,0,cvs.height/LH,0,0);
  ctx.clearRect(0,0,LW,LH);
  if(R){
    drawGrid(T);
    drawAxes(T);
    if(started){
      var tv=clamp(tCur,0,TSHOW);
      drawCurves(T,tv);
      drawAxisText(T);   /* 刻度字先落位（带底色块）并登记占位，标记标签才能避让 */
      drawFlyZone(T,tv);
      drawMarks(T,tv);
      drawCursor(T,tv);
      drawLegend(T);
      drawReadout(T,tv);
    }else{
      drawAxisText(T);
      drawLegend(T);
      drawBlank(T);
    }
    drawFoot(T);
  }
  ctx.restore();
  drawScene(T);
}

/* ===== 面板 ===== */
function segText(sg,i){
  var dt=sg.t1-sg.t0, dir;
  if(sg.stick) dir='随带运动（静摩擦）';
  else if(R.f<1e-9) dir='无摩擦，只受重力分量';
  else dir=(Math.abs(sg.a-R.aUp)<1e-9)
    ?'滑动，摩擦指向'+(upIsPlus()?'高端':'低端')
    :'滑动，摩擦指向'+(upIsPlus()?'低端':'高端');
  return '<span class=tg>'+String(i+1)+'</span>'
    +'<span class=n>Δt = '+num(dt,2)+' s</span>'
    +'<span class=n>a = '+snum(sg.a,2)+' m·s<sup>−2</sup></span>'
    +'<span class=n>末速 '+num(sg.v0+sg.a*dt,2)+' m·s<sup>−1</sup></span>'
    +'<span class=st>'+dir+'</span>';
}
function updPanel(){
  var i,html='',n=0;
  for(i=0;i<R.segs.length&&n<5;i++){
    if(R.segs[i].t1-R.segs[i].t0<=1e-6) continue;
    html+='<div class=seg>'+segText(R.segs[i],n)+'</div>'; n++;
  }
  if(!n) html='<div class=seg><span class=st>物体放上即离开传送带，没有运动过程。</span></div>';
  segsEl.innerHTML=html;
  if(R.stickFromStart) rSync.innerHTML='<span class=n>放上即共速</span>';
  else if(R.tSync===null) rSync.innerHTML='<span class=n>未共速</span>';
  else rSync.innerHTML='<span class=n>'+num(R.tSync,2)+'</span> <span class=n>s</span>';
  rSrel.innerHTML='<span class=n>'+num(R.srel,2)+'</span> <span class=n>m</span>';
  rQ.innerHTML='<span class=n>'+num(R.Q,1)+'</span> <span class=n>J</span>';
  rF.innerHTML='<span class=n>'+num(R.f,1)+'</span> <span class=n>N</span>';
  var txt;
  if(R.exitType==='out'||R.exitType==='back') txt='<span class=n>'+num(R.tEnd,2)+' s</span> 从'+exitEndName()+'离开，末速 <span class=n>'+num(R.vEnd,2)+'</span> m·s<sup>−1</sup>';
  else if(R.exitType==='stop') txt='<span class=n>'+num(R.tEnd,2)+' s</span> 停在带上，距'+endName(false)+' <span class=n>'+num(R.xEnd,2)+'</span> m';
  else txt='超过 60 s 仍未离开';
  rEnd.innerHTML=txt;
  if(!FI) rFly.innerHTML='<span class=n>—</span>';
  else rFly.innerHTML='<span class=n>'+FI.kind+' '+num(FI.tf,2)+' s</span> 落地，水平位移 <span class=n>'+num(FI.dxm,2)+'</span> m，离地 <span class=n>'+num(FI.hm,2)+'</span> m'+(FI.cut?'（落点在画面外）':'');
}
function updOut(){
  oVb.textContent=num(P.vb,1)+' m/s';
  oAb.textContent=num(P.ab,1)+' m/s²';
  oL.textContent=num(P.L,1)+' m';
  oTh.textContent=num(P.th,0)+'°';
  oM.textContent=num(P.m,1)+' kg';
  oV0.textContent=num(P.v0,1)+' m/s';
  oMu.textContent=num(P.mu,2);
}
function syncText(){
  var a=PR&&PR.tSync, b=R.tSync;
  if(a===null&&b===null) return '共速时刻未变（始终未共速）';
  if(a===null) return '由「始终未共速」变为 '+num(b,2)+' s 共速';
  if(b===null) return '由 '+num(a,2)+' s 共速变为始终未共速';
  return '共速时刻 '+num(a,2)+' → '+num(b,2)+' s';
}
function updHint(){
  var keys=['vb','ab','m','v0','mu','L','th','end'], names={
    vb:'带速',ab:'带加速度',m:'质量',v0:'物体初速',mu:'摩擦因数',L:'带长',th:'倾角',end:'初始位置'};
  var ch=[],i,k;
  if(!PP){hint.textContent='设定各项参数后，按「开始」按钮播放：赭色是物体，钢蓝是传送带；物体从带端离开后只受重力，做抛体运动直到落地。'; PP={}; for(k in P) PP[k]=P[k]; PR=R; return;}
  for(i=0;i<keys.length;i++) if(P[keys[i]]!==PP[keys[i]]) ch.push(keys[i]);
  if(!ch.length){ hint.textContent='当前：'+conclusion()+(FI?'；'+flyLine():''); return; }
  var msg='';
  if(ch.length===1){
    k=ch[0];
    if(k==='m') msg='质量 '+num(PP.m,1)+' → '+num(P.m,1)+' kg：两条 v–t 线完全不动（加速度与 m 无关），只有摩擦力 '+num(PR.f,1)+' → '+num(R.f,1)+' N、生热 '+num(PR.Q,1)+' → '+num(R.Q,1)+' J 按比例变。';
    else if(k==='mu') msg='μ '+num(PP.mu,2)+' → '+num(P.mu,2)+'：滑动段加速度按 μg cosθ 变，'+syncText()+'，相对滑动路程 '+num(PR.srel,2)+' → '+num(R.srel,2)+' m。';
    else if(k==='vb') msg='带速 '+num(PP.vb,1)+' → '+num(P.vb,1)+' m·s⁻¹：钢蓝线整体平移/改斜率，共速的目标值随之变，'+syncText()+'。';
    else if(k==='ab') msg='带加速度 '+num(PP.ab,1)+' → '+num(P.ab,1)+' m·s⁻²：钢蓝线的斜率变；共速后物体能否跟住带，取决于 |a带 + g sinθ| 是否 ≤ μg cosθ（现在'+(R.canStick?'能':'不能')+'）。';
    else if(k==='v0') msg='初速 '+num(PP.v0,1)+' → '+num(P.v0,1)+' m·s⁻¹：赭色线的起点变，初始相对速度决定头一段摩擦朝哪边，'+syncText()+'。';
    else if(k==='L') msg='带长 '+num(PP.L,1)+' → '+num(P.L,1)+' m：两条线的形状完全不变，只是截断时刻 '+num(PR.tEnd,2)+' → '+num(R.tEnd,2)+' s。';
    else if(k==='th') msg='倾角 '+num(PP.th,0)+'° → '+num(P.th,0)+'°：重力分量 g sinθ = '+num(R.gs,2)+' m·s⁻² 并入加速度，最大静摩擦项 μg cosθ = '+num(R.mugc,2)+' m·s⁻²，'+syncText()+'。';
    else if(k==='end') msg='初始位置改到'+startEndName()+'：物体从带面另一端放上，初速方向随之反向，滑动段加速度不变，全程 '+num(PR.tEnd,2)+' → '+num(R.tEnd,2)+' s，'+syncText()+'。';
  }else{
    msg='同时改了 '+ch.map(function(x){return names[x];}).join('、')+'：'+syncText()+'，全程 '+num(PR.tEnd,2)+' → '+num(R.tEnd,2)+' s。';
  }
  hint.textContent=msg;
  PP={}; for(k in P) PP[k]=P[k]; PR=R;
}

/* 水平带没有高低之分，两个选项改用左右 */
function syncEndLabels(){
  var hz=Math.abs(P.th)<0.5;
  $('lLow').textContent=hz?'左端':'最下方';
  $('lHigh').textContent=hz?'右端':'最上方';
}
function recompute(){
  syncEndLabels();
  R=solve(P);
  FI=flyCalc(sFit());
  fitScale();
  tCur=clamp(tCur,0,TSHOW);
  updOut(); updPanel(); updHint();
}
function readSliders(){
  P.vb=parseFloat(sVb.value); P.ab=parseFloat(sAb.value);
  P.L=parseFloat(sL.value); P.th=parseFloat(sTh.value);
  P.m=parseFloat(sM.value); P.v0=parseFloat(sV0.value); P.mu=parseFloat(sMu.value);
}

/* ===== 交互 ===== */
/* 按钮三态：未开始（t=0）→ 开始；播放中 → 暂停；中途暂停 → 继续；播完 → 重新播放 */
function syncBtn(){
  var lb;
  if(running) lb='暂停';
  else if(tCur<=1e-9) lb='开始';
  else if(tCur>=TSHOW-1e-9) lb='重新播放';
  else lb='继续';
  bPlay.textContent=lb;
  bPlay.className=running?'':'on';
}
/* 改参数即回到起点并停下，等用户按「开始」 */
function arm(){
  running=false; wait=0; tCur=0; started=false; syncBtn();
}
function bindSlider(el,key){
  el.addEventListener('input',function(){
    readSliders(); arm(); recompute();
  });
}
/* 初始位置：摆在最下方还是最上方，初速一律沿带面指向带内 */
function bindEnd(el,val){
  el.addEventListener('change',function(){
    if(!el.checked) return;
    P.end=val; arm(); recompute();
  });
}
bindSlider(sVb,'vb'); bindSlider(sAb,'ab'); bindSlider(sL,'L'); bindSlider(sTh,'th');
bindSlider(sM,'m'); bindSlider(sV0,'v0'); bindSlider(sMu,'mu');
bindEnd($('kLow'),'low'); bindEnd($('kHigh'),'high');
bPlay.addEventListener('click',function(){
  if(running){ running=false; }
  else{
    if(tCur>=TSHOW-1e-9) tCur=0;
    running=true; wait=0; started=true;
  }
  syncBtn();
});
bReset.addEventListener('click',function(){
  var k;
  for(k in DEF) P[k]=DEF[k];
  sVb.value=String(DEF.vb); sAb.value=String(DEF.ab); sL.value=String(DEF.L);
  sTh.value=String(DEF.th); sM.value=String(DEF.m); sV0.value=String(DEF.v0); sMu.value=String(DEF.mu);
  $('kLow').checked=(DEF.end==='low'); $('kHigh').checked=(DEF.end==='high');
  arm(); recompute();
});
$('kRel').addEventListener('change',function(){SHOW_REL=!!$('kRel').checked;});
$('kMark').addEventListener('change',function(){SHOW_MARK=!!$('kMark').checked;});
$('kLoop').addEventListener('change',function(){LOOP=!!$('kLoop').checked;});

/* ===== 主循环 ===== */
function step(ts){
  if(!last) last=ts;
  var dt=Math.min(0.05,(ts-last)/1000); last=ts;
  if(running&&R){
    if(wait>0){ wait-=dt; if(wait<=0) tCur=0; }
    else{
      tCur+=clamp(TSHOW/9,0.12,1.5)*dt;
      if(tCur>=TSHOW){
        tCur=TSHOW;
        if(LOOP){ wait=1.1; } else { running=false; syncBtn(); }
      }
    }
  }
  draw();
  requestAnimationFrame(step);
}
window.addEventListener('resize',function(){resize(); draw();});
if(D.fonts){try{D.fonts.load('italic 14px KaTeX_Math'); D.fonts.load('14px KaTeX_Main');}catch(e){}}
readSliders();
SHOW_REL=!!$('kRel').checked; SHOW_MARK=!!$('kMark').checked; LOOP=!!$('kLoop').checked;
resize(); recompute(); syncBtn();
requestAnimationFrame(step);
})();
</script>
