:root{
  --bg:#ffffff; --panel:#f5f6f8; --fg:#23262b; --muted:#6b7078; --line:#dcdee3;
  --p1:#a3563c; --p2:#3a6ea5; --p3:#4f7a45; --btn:#eceff3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181c; --panel:#212329; --fg:#e6e6e6; --muted:#9aa0a8; --line:#3a3d45;
    --p1:#cf9179; --p2:#7fa8d4; --p3:#8fae7f; --btn:#2c2f37;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);border:none;
  font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.v{font-family:KaTeX_Math,Georgia,serif;font-style:italic}
.n{font-family:KaTeX_Main,Georgia,serif}
.wrap{width:100%;max-width:920px;margin:0 auto;padding:4px 6px 8px}
canvas{display:block;width:100%;height:282px}
.head{display:flex;align-items:baseline;gap:10px;padding:0 4px 3px;flex-wrap:wrap}
.head b{font-size:15px;letter-spacing:.2px}
.head span{font-size:12.5px;color:var(--muted)}
.panel{background:var(--panel);border-radius:10px;padding:8px 12px 9px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px 16px}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.ctl .lb{white-space:nowrap;color:var(--muted)}
.ctl output{font-family:KaTeX_Main,Georgia,serif;font-size:13.5px;min-width:74px;
  text-align:right;color:var(--fg)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  cursor:pointer;white-space:nowrap}
input[type=range]{flex:1 1 60px;min-width:44px;max-width:230px;accent-color:var(--p2)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{background:var(--btn);color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;font-size:12.5px;cursor:pointer}
button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));
  gap:2px 18px;margin-top:9px;font-size:12.5px;line-height:1.66}
.cell{display:flex;gap:7px;min-width:0}
.cell b{color:var(--muted);font-weight:400;white-space:nowrap;flex:0 0 auto}
.cell span.val{min-width:0}
.cell.full{grid-column:1/-1}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;
  border:1px solid rgba(128,128,128,.45);vertical-align:-1px;margin-right:5px}
.say{margin-top:7px;font-size:12.5px;line-height:1.6;color:var(--muted);
  border-top:1px solid var(--line);padding-top:6px;min-height:34px}
.say em{font-style:normal;color:var(--p1)}
.hint{margin-top:5px;font-size:12px;color:var(--muted);min-height:1.5em}
.vstat{margin-top:2px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.vstat:empty{display:none}
.vstat.warn{color:var(--p2)}
.tbl{margin-top:8px;font-size:12px}
.tbl summary{cursor:pointer;color:var(--muted);font-size:12px;outline:none}
.tbl table{border-collapse:collapse;width:100%;margin-top:6px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:left;
  white-space:nowrap;font-size:11.5px;font-weight:400}
.tbl th{color:var(--muted)}
.tbl tr.cur td{background:rgba(58,110,165,.14)}
@media (max-width:620px){
  .head span{display:none}
  .tbl table{font-size:10.5px}
  .tbl th,.tbl td{padding:2px 3px}
}
</style>
</head>

/* ===== 小工具 ===== */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function q10(x){return Math.pow(10,x);}
function lg(f){return Math.log(f)/Math.LN10;}
function XL(f){return AX0+(lg(f)-LGMIN)*PXD;}
function XM(f){return MX0+(lg(f)-Math.log(2e8)/Math.LN10)*MPD;}
function fFromV(v){return q10(LGMIN+v/2000*LGDEC);}
function vFromF(f){return Math.round((lg(f)-LGMIN)/LGDEC*2000);}
function trim(s){return s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');}
function sig(v,d){return trim(v.toFixed(d));}
function fmtF(f){
  var U=[[1e21,'ZHz'],[1e18,'EHz'],[1e15,'PHz'],[1e12,'THz'],[1e9,'GHz'],
         [1e6,'MHz'],[1e3,'kHz'],[1,'Hz']],i,v;
  for(i=0;i<U.length;i++){
    if(f>=U[i][0]*0.9999){v=f/U[i][0];return sig(v,v>=100?0:(v>=10?1:2))+' '+U[i][1];}
  }
  return sig(f,1)+' Hz';
}
function fmtL(l){
  var U=[[1e3,'km'],[1,'m'],[1e-2,'cm'],[1e-3,'mm'],[1e-6,'μm'],[1e-9,'nm'],
         [1e-12,'pm'],[1e-15,'fm']],i,v;
  for(i=0;i<U.length;i++){
    if(l>=U[i][0]*0.9999){v=l/U[i][0];return sig(v,v>=100?0:(v>=10?1:2))+' '+U[i][1];}
  }
  return sig(l*1e18,2)+' am';
}
/* KaTeX_Main 没有 U+00B7，单位点用 U+22C5；上标由分段排版处理 */
function ctext(s){return s.replace(/\u00b7/g,'\u22c5');}
function fontOf(isVar,size){return (isVar?'italic ':'')+size+'px '+(isVar?'KaTeX_Math':'KaTeX_Main')+',Georgia,serif';}
function partsOf(ps){
  var out=[],i;
  for(i=0;i<ps.length;i++){
    if(typeof ps[i]==='string') out.push([ctext(ps[i]),false]);
    else out.push([ctext(ps[i].t),!!ps[i].v]);
  }
  return out;
}
function rtWidth(ps,size){
  var p=partsOf(ps),i,w=0;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],size); w+=ctx.measureText(p[i][0]).width;}
  return w;
}
function rtext(ps,x,y,size,color,align,base,halo){
  var p=partsOf(ps),i,w=0;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],size); w+=ctx.measureText(p[i][0]).width;}
  var sx=align==='center'?x-w/2:(align==='right'?x-w:x);
  ctx.textAlign='left'; ctx.textBaseline=base||'alphabetic'; ctx.fillStyle=color;
  for(i=0;i<p.length;i++){
    ctx.font=fontOf(p[i][1],size);
    if(halo&&HALO){ctx.strokeStyle=HALO; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeText(p[i][0],sx,y);}
    ctx.fillText(p[i][0],sx,y);
    sx+=ctx.measureText(p[i][0]).width;
  }
  return w;
}
function rtextBox(ps,x,y,size,color,align,base){
  var p=partsOf(ps),i,w=0;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],size); w+=ctx.measureText(p[i][0]).width;}
  var sx=align==='center'?x-w/2:(align==='right'?x-w:x);
  var h=size*1.12, top;
  if(base==='top') top=y-1.5;
  else if(base==='bottom') top=y-h+1;
  else if(base==='middle') top=y-h/2;
  else top=y-size*0.82;
  ctx.fillStyle=HALO; ctx.fillRect(sx-2.5,top,w+5,h);
  ctx.textAlign='left'; ctx.textBaseline=base||'alphabetic'; ctx.fillStyle=color;
  var cx=sx;
  for(i=0;i<p.length;i++){ctx.font=fontOf(p[i][1],size); ctx.fillText(p[i][0],cx,y); cx+=ctx.measureText(p[i][0]).width;}
  return w;
}
function wl2rgb(nm){
  var r=0,g=0,b=0,f=1;
  if(nm>=380&&nm<440){r=-(nm-440)/60;b=1;}
  else if(nm<490){g=(nm-440)/50;b=1;}
  else if(nm<510){g=1;b=-(nm-510)/20;}
  else if(nm<580){r=(nm-510)/70;g=1;}
  else if(nm<645){r=1;g=-(nm-645)/65;}
  else if(nm<=780){r=1;}
  if(nm>=380&&nm<420) f=0.35+0.65*(nm-380)/40;
  else if(nm>700&&nm<=780) f=0.35+0.65*(780-nm)/80;
  return [Math.round(255*Math.pow(clamp(r,0,1)*f,0.8)),
          Math.round(255*Math.pow(clamp(g,0,1)*f,0.8)),
          Math.round(255*Math.pow(clamp(b,0,1)*f,0.8))];
}
function hex(rgb){
  function h2(v){var s=v.toString(16);return s.length<2?'0'+s:s;}
  return '#'+h2(rgb[0])+h2(rgb[1])+h2(rgb[2]);
}
function mixc(a,b,t){
  var A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  var r=Math.round(((A>>16)&255)*(1-t)+((B>>16)&255)*t);
  var g=Math.round(((A>>8)&255)*(1-t)+((B>>8)&255)*t);
  var l=Math.round((A&255)*(1-t)+(B&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+l).toString(16).slice(1);
}

/* ===== 波形（1 米窗口，真实比例） ===== */
function drawWave(T){
  HALO=T.bg;
  var lam=C/F, i, x, y, w=AX1-AX0, ppm=w/1.0;
  var cyc=1/lam;
  rtext(['1 米窗口内的波形（横向与米尺同比例）'],AX0,YW_TITLE,9,T.muted,'left','alphabetic');

  for(i=0;i<=10;i++){
    x=AX0+i*w/10;
    line(x,YW_CY-YW_A-11,x,YR-11,((i%5===0)?T.grid2:T.grid),1);
  }
  line(AX0,YW_CY,AX1,YW_CY,T.grid2,1);

  if(lam>=0.0105){
    ctx.beginPath();
    for(i=0;i<=w;i+=1.5){
      x=AX0+i;
      y=YW_CY-YW_A*Math.sin(2*Math.PI*(i/ppm)/lam);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=T.curve; ctx.lineWidth=2.2; ctx.lineJoin='round';
    ctx.stroke();
  }else{
    ctx.fillStyle=T.curve; ctx.globalAlpha=0.42;
    ctx.fillRect(AX0,YW_CY-YW_A+4,w,2*YW_A-8);
    ctx.globalAlpha=1;
  }

  /* 一个波长的双箭头 */
  if(lam>=0.06&&lam<=0.72){
    var xa=AX0+(0.25*lam)*ppm, xb=xa+lam*ppm, yy=YW_CY-YW_A-3;
    line(xa,yy,xb,yy,T.p1,1.2);
    arrowHeadDir(xa,yy,-1,0,T.p1,5);
    arrowHeadDir(xb,yy,1,0,T.p1,5);
    rtextBox([{t:'\u03bb',v:true}],(xa+xb)/2,yy-3,10.5,T.p1,'center','bottom');
  }

  /* 米尺 */
  line(AX0,YR,AX1,YR,T.axis,1.1);
  for(i=0;i<=10;i++){
    x=AX0+i*w/10;
    line(x,YR,x,YR+3.5,T.tick,1);
    if(i%2===0){
      if(i===10) rtext(['100 cm'],AX1,YR+13,8.5,T.muted,'right','alphabetic');
      else rtext([String(i*10)],x,YR+13,8.5,T.muted,'center','alphabetic');
    }
  }
  /* 右下角读数 */
  var note;
  if(cyc<0.92) note='波长 '+fmtL(lam)+'，1 米窗口装不下一个波';
  else if(cyc>95) note='波太密，屏幕已分辨不出单个波';
  else note='窗口里 '+sig(cyc,1)+' 个波';
  rtext([note],AX1,YW_TITLE,8.5,T.muted,'right','alphabetic');
}

var curCat=0, curBand=-1, curSig=-1;
var LBOX=[];   /* 画布文字占位盒 [x0,y0,x1,y1]，游标线在其处断开 */
function boxAt(x,y,size,w,align){
  var x0=(align==='center')?x-w/2:(align==='right'?x-w:x);
  LBOX.push([x0-2,y-size*0.84,x0+w+2,y+size*0.22]);
}
function vlineSkip(x,y0,y1,color,w){
  var cuts=[],i,b;
  for(i=0;i<LBOX.length;i++){
    b=LBOX[i];
    if(x>=b[0]&&x<=b[2]&&b[3]>y0&&b[1]<y1) cuts.push([Math.max(y0,b[1]),Math.min(y1,b[3])]);
  }
  cuts.sort(function(a,b2){return a[0]-b2[0];});
  var y=y0;
  for(i=0;i<cuts.length;i++){
    if(cuts[i][0]>y) line(x,y,x,cuts[i][0],color,w);
    if(cuts[i][1]>y) y=cuts[i][1];
  }
  if(y<y1) line(x,y,x,y1,color,w);
}

function draw(){
  var T=theme();
  curCat=catOf(F); curBand=bandOf(F); curSig=-1;
  var i;
  for(i=0;i<SIGS.length;i++){ if(Math.abs(lg(SIGS[i].f)-lg(F))<0.006) curSig=i; }
  HALO=T.bg;
  LBOX.length=0;
  ctx.save();
  ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);
  ctx.clearRect(0,0,LW,LH);
  drawSpec(T);
  drawBands(T);
  drawMini(T);
  drawWave(T);
  drawCursor(T);
  ctx.restore();
}

/* ===== 声音 ===== */
var AC=null, voice=null, voiceTried=false, userActed=false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  var vs=window.speechSynthesis.getVoices()||[],i;
  for(i=0;i<vs.length;i++){
    var tag=(vs[i].lang||'')+' '+(vs[i].name||'');
    if(/zh[-_]?CN|zh[-_]?Hans|Chinese|中文|普通话|Huihui|Yaoyao|Xiaoxiao|Kangkang/i.test(tag)) return vs[i];
  }
  return null;
}
function initVoice(){
  if(voiceTried&&voice) return;
  voice=pickVoice();
  voiceTried=true;
}
if('speechSynthesis' in window){ initVoice(); }
function ensureAC(){
  if(!AC){
    var K=window.AudioContext||window.webkitAudioContext;
    if(!K) return null;
    try{AC=new K();}catch(e){return null;}
  }
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function staticBurst(){
  var ac=ensureAC(); if(!ac) return;
  try{
    var dur=0.16, n=Math.max(1,Math.floor(ac.sampleRate*dur));
    var buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0), i;
    for(i=0;i<n;i++){
      d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);
    }
    var src=ac.createBufferSource(); src.buffer=buf;
    var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=0.5;
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start();
  }catch(e){}
}
function beepSeq(){
  var ac=ensureAC(); if(!ac) return;
  try{
    var f0=[660,880,1170], t0=ac.currentTime, i;
    for(i=0;i<3;i++){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.value=f0[i];
      g.gain.setValueAtTime(0.0001,t0+i*0.13);
      g.gain.exponentialRampToValueAtTime(0.11,t0+i*0.13+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.13+0.11);
      o.connect(g); g.connect(ac.destination);
      o.start(t0+i*0.13); o.stop(t0+i*0.13+0.13);
    }
  }catch(e){}
}
var vstatBox=null;
function setVstat(t,isWarn){
  if(!vstatBox) vstatBox=$('vstat');
  if(!vstatBox) return;
  vstatBox.textContent=t||'';
  vstatBox.className=isWarn?'vstat warn':'vstat';
}
function hasZhVoice(){
  var v=pickVoice();
  return !!v;
}
function voiceFailText(code){
  var vs=[];
  try{ vs=(window.speechSynthesis&&window.speechSynthesis.getVoices())||[]; }catch(e){}
  if(!vs.length) return '本机没有可用的语音引擎，只发提示音';
  if(!pickVoice()) return '本机没有中文语音，只发提示音（Win 设置 \u2192 时间和语言 \u2192 语音，添加中文语音）';
  if(code==='not-allowed') return '浏览器拦下了朗读，再点一次按钮';
  if(code==='interrupted'||code==='canceled') return '朗读被打断，再点一次按钮';
  if(code==='audio-busy'||code==='audio-hardware') return '音频设备不可用，只发提示音';
  return '本机语音引擎没有响应，只发提示音；换手机或普通电脑打开就能听到朗读';
}
function speakNow(txt){
  var ss=window.speechSynthesis;
  if(!ss){ beepSeq(); setVstat('这个浏览器不支持语音播报，只发提示音',1); return; }
  try{
    ss.cancel();
    var v=voice||pickVoice();
    var u=new SpeechSynthesisUtterance(txt);
    if(v){ u.voice=v; u.lang=v.lang||'zh-CN'; }else{ u.lang='zh-CN'; }
    u.rate=1.0; u.pitch=1.0; u.volume=1.0;
    var started=false, reported=false;
    function fail(code){
      if(reported||started) return;
      reported=true;
      beepSeq();
      setVstat(voiceFailText(code),1);
      if(vstatBox) vstatBox.title='错误码：'+code;
      voice=null;
    }
    u.onstart=function(){ started=true; setVstat('正在朗读'); };
    u.onend=function(){ if(started) setVstat(''); };
    u.onerror=function(e){
      var c=(e&&e.error)||'error';
      if(c==='interrupted'||c==='canceled') return;
      fail(c);
    };
    /* cancel 与 speak 在同一帧里连着调用时，Chrome/Edge 会把后者吞掉，隔一帧再送 */
    setTimeout(function(){
      try{ ss.speak(u); }catch(e){ fail('throw'); }
      setTimeout(function(){ if(!started) fail('no-response'); },1200);
    },60);
  }catch(e){
    beepSeq();
    setVstat('朗读启动失败，只发提示音',1);
  }
}
var clipEl=null, clipSeq=0;
function stopClip(){
  if(clipEl){ try{ clipEl.pause(); }catch(e){} clipEl=null; }
}
function playClip(i,txt){
  var seq=++clipSeq, el;
  try{ el=new Audio(SAYAUD[i]); }catch(e){ speakNow(txt); return; }
  clipEl=el;
  el.preload='auto';
  el.onended=function(){ if(seq===clipSeq) setVstat(''); };
  el.onerror=function(){ if(seq===clipSeq) speakNow(txt); };
  var p;
  try{ p=el.play(); }catch(e){ speakNow(txt); return; }
  setVstat('正在播报');
  if(p&&p.catch){
    p.catch(function(){ if(seq===clipSeq) speakNow(txt); });
  }
}
function announce(txt,idx){
  if(!sayOn) return;
  ensureAC();
  stopClip();
  staticBurst();
  /* 先响 0.17 s 调台噪声，再接入人声，像真的拨到那个台 */
  setTimeout(function(){
    if(idx>=0&&idx<SAYAUD.length&&window.Audio) playClip(idx,txt);
    else speakNow(txt);
  },170);
}
/* 进页面先探一次：本机到底有没有语音，免得点了没反应还不明原因 */
function probeVoice(){
  if(userActed) return;
  var ss=window.speechSynthesis;
  if(!ss){ setVstat('这个浏览器不支持语音播报，用提示音代替',1); return; }
  var vs=[];
  try{ vs=ss.getVoices()||[]; }catch(e){}
  if(!vs.length) return;          /* 还没加载完，等 voiceschanged */
  if(hasZhVoice()) setVstat('');
  else setVstat('本机没有中文语音，朗读会退成提示音（Win 设置 → 时间和语言 → 语音 里可添加）',1);
}
if('speechSynthesis' in window){
  setTimeout(probeVoice,700);
  setTimeout(probeVoice,2200);
  if(window.speechSynthesis.addEventListener){
    window.speechSynthesis.addEventListener('voiceschanged',function(){
      voice=pickVoice(); probeVoice();
    });
  }
}

/* ===== 面板 ===== */
function nsp(s){return '<span class=\'n\'>'+s+'</span>';}
function upd(){
  var lam=C/F, cat=catOf(F), band=bandOf(F), i, fTxt=fmtF(F), lTxt=fmtL(lam);
  var fp=fTxt.split(' '), lp=lTxt.split(' ');
  oF.innerHTML=nsp(fp[0])+' '+nsp(fp[1]);
  oL.innerHTML=nsp(lp[0])+' '+nsp(lp[1]);

  if(cat===0&&band>=0){
    oB.innerHTML='<span class=\'n\'>'+BANDS[band].ab+'</span> '+BANDS[band].n+' \u00b7 '+BANDS[band].s;
    oU.textContent=BANDS[band].u;
  }else{
    oB.textContent=CATS[cat].n;
    oU.textContent=CATU[CATS[cat].n]||'\u2014';
  }

  if(cat===2){
    var nm=lam*1e9, rgb=wl2rgb(nm);
    oC.innerHTML='<i class=\'sw\' style=\'background:'+hex(rgb)+'\'></i>'+colName(nm)+
      '（'+nsp(sig(nm,0))+' nm）';
  }else{
    var cc=CATS[cat].c||'#888888';
    oC.innerHTML='<i class=\'sw\' style=\'background:'+cc+'\'></i>\u4e0d\u53ef\u89c1';
  }

  for(i=0;i<REF.length;i++){ if(lam>=REF[i][0]){oR.textContent=REF[i][1];break;} }

  if(prevCat>=0&&(cat!==prevCat||band!==prevBand)){
    if(band>=0&&prevBand>=0&&cat===prevCat){
      hintBox.textContent='跨过倍频边界：从『'+BANDS[prevBand].n+' '+BANDS[prevBand].s+
        '』进入『'+BANDS[band].n+' '+BANDS[band].s+'』';
    }else if(cat!==prevCat){
      hintBox.textContent='离开『'+CATS[prevCat].n+'』，进入『'+CATS[cat].n+'』';
    }
  }
  prevCat=cat; prevBand=band;

  /* 台位高亮 */
  for(i=0;i<staBtns.length;i++){
    if(staBtns[i]) staBtns[i].className=(Math.abs(lg(STA[i].f)-lg(F))<0.006)?'on':'';
  }
}
function nearestSta(f,tol){
  var best=-1,bd=1e9,i,d;
  for(i=0;i<STA.length;i++){
    d=Math.abs(lg(STA[i].f)-lg(f));
    if(d<bd){bd=d;best=i;}
  }
  return (best>=0&&bd<tol)?best:-1;
}
function setF(f,quiet){
  F=clamp(f,3,SPMAX);
  sF.value=String(vFromF(F));
  if(!quiet) refresh();
}
function refresh(){ upd(); draw(); }

/* ===== 交互 ===== */
var lastF=F;
sF.addEventListener('input',function(){
  userActed=true;
  F=fFromV(parseFloat(sF.value));
  refresh();
});
sF.addEventListener('change',function(){
  var best=nearestSta(F,0.022),bd=best>=0?Math.abs(lg(STA[best].f)-lg(F)):1e9;
  if(best>=0){
    F=STA[best].f; sF.value=String(vFromF(F)); refresh();
    sayBox.innerHTML='<em>'+STA[best].k+'</em>：'+STA[best].say;
    announce(STA[best].say,best);
  }else{
    sayBox.textContent='没有对准台位。松手时停到按钮上的频率附近，就会播出那个信号。';
  }
});
var staBtns=[];
for(var bi=0;bi<STA.length;bi++){
  (function(k){
    var b=$('b'+k);
    if(!b) return;
    staBtns[k]=b;
    b.addEventListener('click',function(){
      userActed=true;
      F=STA[k].f; sF.value=String(vFromF(F)); refresh();
      sayBox.innerHTML='<em>'+STA[k].k+'</em>：'+STA[k].say;
      announce(STA[k].say,k);
    });
  })(bi);
}
kSay.addEventListener('change',function(){
  userActed=true;
  sayOn=!!kSay.checked;
  if(!sayOn){
    if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}
    setVstat('');
  }
});

/* 波段对照表 */
(function buildTable(){
  var h='<table><tr><th>序号</th><th>频段</th><th>缩写</th><th>频率范围</th><th>俗称</th><th>波长范围</th><th>典型用途</th></tr>',i,b;
  for(i=0;i<BANDS.length;i++){
    b=BANDS[i];
    h+='<tr><td>'+nsp(i+1)+'</td><td>'+b.n+'</td><td>'+nsp(b.ab)+'</td><td>'+
       fmtF(b.f0)+' \u2013 '+fmtF(b.f1)+'</td><td>'+
       (i===11?'丝米波 / 亚毫米波':b.s)+'</td><td>'+b.lw+'</td><td>'+b.u+'</td></tr>';
  }
  h+='</table>';
  $('tblBox').innerHTML=h;
})();

window.addEventListener('resize',function(){resize();draw();});
if(D.fonts){D.fonts.load('italic 14px KaTeX_Math'); D.fonts.load('14px KaTeX_Main');}
resize();
F=fFromV(parseFloat(sF.value));
(function(){
  var b=nearestSta(F,0.02);
  if(b>=0){
    F=STA[b].f; sF.value=String(vFromF(F));
    sayBox.innerHTML='<em>'+STA[b].k+'</em>：'+STA[b].say;
  }
})();
refresh();
hintBox.textContent='频率每升高 10 倍，波长缩短到原来的十分之一；真空中两者乘积恒为 3.0\u00d710\u2078 m/s。';
})();
</script>
